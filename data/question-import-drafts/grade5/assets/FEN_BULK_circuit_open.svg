<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7fafc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#183247"><text x="50" y="60" font-size="30" font-weight="bold">Deney şeması: açık anahtar</text><text x="50" y="105" font-size="20">Bu çizim bir devre şemasıdır; kurulmuş ve ölçülmüş deney sonucu değildir.</text><path d="M480 480H180V180H465M535 180H820V310M820 380V480H510" fill="none" stroke="#183247" stroke-width="4"/><circle cx="500" cy="180" r="35" fill="white" stroke="#183247" stroke-width="4"/><path d="M480 160l40 40m0-40-40 40M480 450v60M510 465v30" stroke="#183247" stroke-width="4"/><circle cx="820" cy="310" r="6" fill="#183247"/><circle cx="820" cy="380" r="6" fill="#183247"/><path d="M820 310l45 60" stroke="#183247" stroke-width="4"/><text x="560" y="155" font-size="24">ampul</text><text x="455" y="570" font-size="24">pil</text><text x="885" y="350" font-size="24">anahtar</text><text x="50" y="650" font-size="21">Yalnız uygun düşük gerilimli pil ve öğretmen gözetimi. Priz kullanılmaz.</text></g></svg>