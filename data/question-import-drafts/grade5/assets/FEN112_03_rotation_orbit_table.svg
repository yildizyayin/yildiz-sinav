<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-label="Ay'ın iki hareketini karşılaştıralım"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#051121"/><stop offset="1" stop-color="#183750"/></linearGradient><radialGradient id="moon" cx=".35" cy=".3"><stop stop-color="#f0f2f2"/><stop offset=".55" stop-color="#b5bcc2"/><stop offset="1" stop-color="#4f6170"/></radialGradient><radialGradient id="earth" cx=".25" cy=".2"><stop stop-color="#4ee5ef"/><stop offset=".4" stop-color="#1786bf"/><stop offset="1" stop-color="#103869"/></radialGradient><radialGradient id="pit"><stop stop-color="#6f757c"/><stop offset=".76" stop-color="#707b85"/><stop offset=".81" stop-color="#f6f7e9"/><stop offset="1" stop-color="#abb4b9"/></radialGradient></defs><rect width="960" height="570" rx="22" fill="url(#bg)"/><text x="34" y="49" font-family="Arial,DejaVu Sans" font-weight="bold" font-size="27" fill="#fff">Ay'ın iki hareketini karşılaştıralım</text><rect x="40" y="103" width="880" height="349" rx="20" fill="#12314a" stroke="#447187" stroke-width="3"/><g font-family="Arial,DejaVu Sans" fill="#ecf8ff"><text x="73" y="154" font-size="24" font-weight="bold">Hareket</text><text x="390" y="154" font-size="24" font-weight="bold">Neye göre?</text><text x="667" y="154" font-size="24" font-weight="bold">Yaklaşık süre</text></g><path d="M75 180 H888 M75 288 H888" stroke="#648da4" stroke-width="2"/><g font-family="Arial,DejaVu Sans" fill="#e7f4fa" font-size="23"><text x="74" y="230">Dönme</text><text x="390" y="230">Kendi ekseni</text><text x="669" y="230">27 gün</text><text x="74" y="339">Dolanma</text><text x="390" y="339">Dünya çevresi</text><text x="669" y="339">27 gün</text></g><text x="72" y="409" font-family="Arial,DejaVu Sans" fill="#f8d49c" font-size="18">Süreler yuvarlanmıştır; iki hareket eş zamanlıdır.</text><text x="56" y="494" font-family="Arial,DejaVu Sans" fill="#d3ebf8" font-size="18">Aynı yüzün Dünya'ya dönük kalması bu iki hareketin uyumuyl