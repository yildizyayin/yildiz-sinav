name: Question production quality calibration
on:
  push:
    branches: [staging]
    paths: [.github/question-production-calibration.execute]
permissions:
  contents: read
concurrency:
  group: question-production-calibration
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Frozen verifier challenge and four distinct single-attempt pilot tasks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-production-calibration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-production-calibration-${{ github.run_id }}
          path: tmp/question-production-calibration/
