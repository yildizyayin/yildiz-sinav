name: Anunex 100K Scale Benchmark

on:
  workflow_dispatch:
    inputs:
      target:
        description: Benchmark target
        required: true
        default: local
        type: choice
        options:
          - local
          - staging

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify source before benchmark
        run: npm run typecheck && npm test && npm run build

      - name: Require Cloudflare credentials for staging
        if: ${{ inputs.target == 'staging' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '') }}
        run: |
          echo "Cloudflare credentials are required for the staging 100K benchmark."
          exit 1

      - name: Apply migrations to local benchmark DB
        if: ${{ inputs.target == 'local' }}
        run: npx wrangler d1 migrations apply DB --local --persist-to=.wrangler/scale-state

      - name: Apply migrations to staging D1
        if: ${{ inputs.target == 'staging' }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Generate isolated 100K fixture SQL
        run: node scripts/generate-scale-100k-sql.mjs

      - name: Seed 100K benchmark dataset locally
        if: ${{ inputs.target == 'local' }}
        run: npx wrangler d1 execute DB --local --persist-to=.wrangler/scale-state --file=tmp/scale-100k/setup.sql

      - name: Seed 100K benchmark dataset on staging
        if: ${{ inputs.target == 'staging' }}
        run: npx wrangler d1 execute DB --remote --file=tmp/scale-100k/setup.sql

      - name: Generate 100K participants locally
        if: ${{ inputs.target == 'local' }}
        id: participant_local
        shell: bash
        run: |
          start=$(date +%s%3N)
          npx wrangler d1 execute DB --local --persist-to=.wrangler/scale-state --file=tmp/scale-100k/participants.sql
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Generate 100K participants on staging
        if: ${{ inputs.target == 'staging' }}
        id: participant_staging
        shell: bash
        run: |
          start=$(date +%s%3N)
          npx wrangler d1 execute DB --remote --file=tmp/scale-100k/participants.sql
          end=$(date +%s%3N)
          echo "duration_ms=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Verify local benchmark counts
        if: ${{ inputs.target == 'local' }}
        shell: bash
        run: |
          npx wrangler d1 execute DB --local --persist-to=.wrangler/scale-state --command="SELECT (SELECT count(*) FROM student_enrollments WHERE institution_id='inst_scale100k') student_count,(SELECT count(*) FROM exam_participants WHERE institution_id='inst_scale100k' AND exam_id='exam_scale100k') participant_count,(SELECT count(DISTINCT class_id) FROM student_enrollments WHERE institution_id='inst_scale100k') class_count,(SELECT count(DISTINCT booklet_code) FROM exam_participants WHERE institution_id='inst_scale100k' AND exam_id='exam_scale100k') booklet_count" --json > tmp/scale-100k/verify.json
          node scripts/analyze-scale-100k-result.mjs tmp/scale-100k/verify.json "${{ steps.participant_local.outputs.duration_ms }}" local
          cat SCALE_100K_REPORT.md

      - name: Verify staging benchmark counts
        if: ${{ inputs.target == 'staging' }}
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT (SELECT count(*) FROM student_enrollments WHERE institution_id='inst_scale100k') student_count,(SELECT count(*) FROM exam_participants WHERE institution_id='inst_scale100k' AND exam_id='exam_scale100k') participant_count,(SELECT count(DISTINCT class_id) FROM student_enrollments WHERE institution_id='inst_scale100k') class_count,(SELECT count(DISTINCT booklet_code) FROM exam_participants WHERE institution_id='inst_scale100k' AND exam_id='exam_scale100k') booklet_count" --json > tmp/scale-100k/verify.json
          node scripts/analyze-scale-100k-result.mjs tmp/scale-100k/verify.json "${{ steps.participant_staging.outputs.duration_ms }}" staging
          cat SCALE_100K_REPORT.md

      - name: Upload benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: anunex-scale-100k-${{ inputs.target }}
          path: SCALE_100K_REPORT.md
          if-no-files-found: ignore

      - name: Cleanup local benchmark data
        if: ${{ always() && inputs.target == 'local' }}
        continue-on-error: true
        run: npx wrangler d1 execute DB --local --persist-to=.wrangler/scale-state --file=tmp/scale-100k/cleanup.sql

      - name: Cleanup staging benchmark data
        if: ${{ always() && inputs.target == 'staging' }}
        continue-on-error: true
        run: npx wrangler d1 execute DB --remote --file=tmp/scale-100k/cleanup.sql
