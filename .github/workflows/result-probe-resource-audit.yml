name: Audit completed probe resources
on:
  push:
    branches: [staging]
    paths: [.github/probe-resource-audit.trigger, .github/probe-resource-cleanup.trigger]
permissions:
  contents: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read exact completed PR resource inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-result-probe-resources.mjs
      - name: Clean only frozen audited merged PR resources
        if: contains(github.event.head_commit.message, 'Apply frozen probe cleanup')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cleanup-result-probe-resources.mjs .github/probe-resource-cleanup-plan.json
