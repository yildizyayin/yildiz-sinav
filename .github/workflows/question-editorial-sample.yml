name: Question editorial real-model sample
on:
  push:
    branches: [staging]
    paths: [.github/question-editorial-sample.execute]
permissions:
  contents: read
concurrency:
  group: question-editorial-sample
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate at most one bounded editorial sample
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-editorial-sample.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-editorial-sample-${{ github.sha }}-${{ github.run_attempt }}
          path: tmp/question-editorial-proof/
