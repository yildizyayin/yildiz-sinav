name: Temporary Cloudflare Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.head_ref == 'preview/live-test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify source
        run: npm run typecheck && npm test && npm run build

      - name: Deploy to temporary Cloudflare account
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --temporary 2>&1 | tee /tmp/cloudflare-preview.log

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --temporary

      - name: Load synthetic demo data
        shell: bash
        run: |
          npm run seed:generate
          npx wrangler d1 execute DB --remote --file=tmp/demo-seed.sql --temporary

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/cloudflare-preview.log | tail -1)
          if [ -z "$URL" ]; then
            echo "Preview URL could not be extracted"
            exit 1
          fi
          echo "Preview URL: $URL"
          curl --fail --silent --show-error "$URL/api/config"
          echo
