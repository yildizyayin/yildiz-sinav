name: Bootstrap Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.bootstrap/source.b64.*'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore project source
        shell: bash
        run: |
          cat .bootstrap/source.b64.* | base64 -d > /tmp/yildiz-src.tgz
          tar -xzf /tmp/yildiz-src.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: restore complete V1 application source"
          git push
