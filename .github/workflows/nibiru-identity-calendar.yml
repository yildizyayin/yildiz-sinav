name: Nibiru Identity Calendar Acceptance
on:
  push:
    branches: [fix/nibiru-identity-calendar-20261012]
    paths: ['worker/**', 'src/**', 'tests/**', 'scripts/browser-nibiru-calendar.mjs', 'scripts/live-*.mjs', 'package*.json', 'migrations/**', '.github/workflows/nibiru-identity-calendar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nibiru-identity-calendar-acceptance
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-migration-policy.mjs
      - run: npx wrangler d1 migrations apply DB --local --persist-to=.wrangler/identity-calendar-ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --testTimeout=30000
      - run: npm run build
        id: build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/browser-nibiru-calendar.mjs
        if: ${{ always() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nibiru-calendar-browser-${{ github.sha }}
          path: tmp/nibiru-calendar-browser/
          if-no-files-found: warn
  live-stage:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: https://demo.anunex.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-nibiru-free-account.mjs
      - run: node scripts/live-nibiru-ai-probe.mjs
      - run: node scripts/live-nibiru-calendar-acceptance.mjs
