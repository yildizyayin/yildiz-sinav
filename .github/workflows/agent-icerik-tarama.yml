name: "Ajan 2 - İçerik Eksik Tarayıcı"

# Kaynak kodunda ve içerik tanımlarında bekleyen resmi/müfredat içeriğini
# işaretleyen durumları haftalık raporlar.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: icerik-tarama-ajani
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Eksik işaretleri say
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          patterns='NEEDS_DEFINITION|CONTENT_REQUIRED|TODO_MEB|TODO_RESMI_VERI'
          results="$(git grep -n -E "$patterns" -- . \
            ':!dist' \
            ':!node_modules' \
            ':!.github/workflows/agent-icerik-tarama.yml' \
            ':!docs/ai-agents/*' || true)"

          if [[ -n "$results" ]]; then
            count="$(printf '%s\n' "$results" | wc -l | tr -d ' ')"
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "details<<EOF"
            if (( count > 0 )); then
              printf '%s\n' "$results" | head -n 50
              if (( count > 50 )); then
                echo ""
                echo "... ve $((count - 50)) satır daha (tam liste için Actions log'una bak)"
              fi
            else
              echo "Hiç eksik işaret bulunamadı. 🎉"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Haftalık rapor Issue'sunu güncelle
        env:
          MATCH_COUNT: ${{ steps.scan.outputs.count }}
          MATCH_DETAILS: ${{ steps.scan.outputs.details }}
        uses: actions/github-script@v7
        with:
          script: |
            const count = process.env.MATCH_COUNT || "0";
            const details = process.env.MATCH_DETAILS || "Tarama çıktısı üretilemedi.";
            const title = "📋 Haftalık İçerik Eksik Raporu";

            const body = [
              `**Tarama tarihi:** ${new Date().toISOString().split("T")[0]}`,
              `**Bulunan eksik işaret sayısı:** ${count}`,
              "",
              "```text",
              details,
              "```",
              "",
              "_Bu rapor otomatik olarak haftalık taranır (agent-icerik-tarama.yml). Aralık lansmanı öncesi bu sayının düşüş trendini izle._",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "icerik-tarama-ajani",
              per_page: 10,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Güncellendi: ${new Date().toISOString()} — ${count} eksik işaret.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["icerik-tarama-ajani"],
                body,
              });
            }
