name: Bootstrap Production Super Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/bootstrap-production-admin.trigger'

permissions:
  contents: read

jobs:
  bootstrap-production-admin:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_INITIAL_ADMIN_EMAIL: ${{ vars.PROD_INITIAL_ADMIN_EMAIL }}
      PROD_INITIAL_ADMIN_PASSWORD: ${{ secrets.PROD_INITIAL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate bootstrap configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PROD_INITIAL_ADMIN_EMAIL" || (echo "Missing PROD_INITIAL_ADMIN_EMAIL" && exit 1)
          test -n "$PROD_INITIAL_ADMIN_PASSWORD" || (echo "Missing PROD_INITIAL_ADMIN_PASSWORD" && exit 1)
      - name: Install dependencies
        run: npm install
      - name: Resolve the D1 database bound to the production Worker
        id: production-d1
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/yildiz-sinav-prod"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          versions="$(curl --fail-with-body --silent --show-error --header "$auth_header" "$api_base/versions")"
          version_id="$(jq -r '.result.items[0].id // .result[0].id // empty' <<<"$versions")"
          test -n "$version_id" || (echo "Production Worker version could not be resolved." >&2 && exit 1)
          detail="$(curl --fail-with-body --silent --show-error --header "$auth_header" "$api_base/versions/$version_id")"
          database_id="$(jq -r '.result.resources.bindings[] | select(.name == "DB" and .type == "d1") | .database_id // .id // empty' <<<"$detail")"
          test -n "$database_id" || (echo "Production D1 binding could not be resolved." >&2 && exit 1)
          database="$(curl --fail-with-body --silent --show-error --header "$auth_header" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$database_id")"
          database_name="$(jq -r '.result.name // empty' <<<"$database")"
          test -n "$database_name" || (echo "Production D1 database name could not be resolved." >&2 && exit 1)
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "database_name=$database_name" >> "$GITHUB_OUTPUT"
      - name: Materialize the exact production D1 configuration
        env:
          DATABASE_ID: ${{ steps.production-d1.outputs.database_id }}
          DATABASE_NAME: ${{ steps.production-d1.outputs.database_name }}
        run: |
          jq --arg id "$DATABASE_ID" --arg name "$DATABASE_NAME" \
            '.d1_databases[0].database_id=$id | .d1_databases[0].database_name=$name' \
            wrangler.production.jsonc > wrangler.production.admin.json
      - name: Generate one-time administrator record
        run: node scripts/generate-production-admin.mjs
      - name: Create or reset production Super Admin
        run: npx wrangler d1 execute DB --remote --config wrangler.production.admin.json --file=tmp/production-admin.sql
      - name: Safety note
        run: echo "Production administrator bootstrap completed on the Worker-bound D1. Remove PROD_INITIAL_ADMIN_PASSWORD after the first successful login."
      - name: Remove transient administrator material
        if: ${{ always() }}
        run: rm -f tmp/production-admin.sql wrangler.production.admin.json
