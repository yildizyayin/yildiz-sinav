name: Bootstrap Production Super Admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-production-admin:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_INITIAL_ADMIN_EMAIL: ${{ vars.PROD_INITIAL_ADMIN_EMAIL }}
      PROD_INITIAL_ADMIN_PASSWORD: ${{ secrets.PROD_INITIAL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate bootstrap configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PROD_INITIAL_ADMIN_EMAIL" || (echo "Missing PROD_INITIAL_ADMIN_EMAIL" && exit 1)
          test -n "$PROD_INITIAL_ADMIN_PASSWORD" || (echo "Missing PROD_INITIAL_ADMIN_PASSWORD" && exit 1)
      - name: Install dependencies
        run: npm install
      - name: Generate one-time administrator record
        run: node scripts/generate-production-admin.mjs
      - name: Create production Super Admin
        run: npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file=tmp/production-admin.sql
      - name: Safety note
        run: echo "Production administrator bootstrap completed without demo data. Remove PROD_INITIAL_ADMIN_PASSWORD after the first successful login."
