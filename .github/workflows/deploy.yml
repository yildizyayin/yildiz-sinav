name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: https://yildiz-sinav-v1.rtsgida.workers.dev
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify source
        run: npm run typecheck && npm test && npm run build

      - name: Cloudflare credentials status
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare permanent deployment skipped because repository secrets are not configured yet."

      - name: Validate WhatsApp secret set
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          configured=0
          for key in WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID; do
            if [ -n "${!key}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "WhatsApp activation is partial: configure all four Meta secrets or none."
            exit 1
          fi
          echo "WhatsApp Meta secret count: $configured/4"

      - name: Apply D1 migrations before deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and auto-provision D1/R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then
            secret_file="$RUNNER_TEMP/nibiru-whatsapp-secrets.json"
            node -e "const fs=require('fs');fs.writeFileSync(process.argv[1],JSON.stringify({WHATSAPP_VERIFY_TOKEN:process.env.WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET:process.env.WHATSAPP_APP_SECRET,WHATSAPP_ACCESS_TOKEN:process.env.WHATSAPP_ACCESS_TOKEN,WHATSAPP_PHONE_NUMBER_ID:process.env.WHATSAPP_PHONE_NUMBER_ID}))" "$secret_file"
            npx wrangler deploy --secrets-file "$secret_file"
            rm -f "$secret_file"
          else
            npx wrangler deploy
          fi

      - name: Live WhatsApp webhook security checks
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WHATSAPP_VERIFY_TOKEN != '' && env.WHATSAPP_APP_SECRET != '' && env.WHATSAPP_ACCESS_TOKEN != '' && env.WHATSAPP_PHONE_NUMBER_ID != '' }}
        run: node scripts/live-whatsapp-webhook-smoke.mjs

      - name: Load synthetic staging demo data idempotently
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: |
          npm run seed:generate
          npx wrangler d1 execute DB --remote --file=tmp/demo-seed.idempotent.sql
          npx wrangler d1 execute DB --remote --file=tmp/standard-role-seed.idempotent.sql
          npx wrangler d1 execute DB --remote --file=tmp/demo-camera-fixture.idempotent.sql
          npx wrangler d1 execute DB --remote --file=tmp/demo-standard-fixture.idempotent.sql
          npx wrangler d1 execute DB --remote --file=scripts/demo-standard-closure-fixture.sql
          node scripts/seed-standard-assets.mjs

      - name: Live staging smoke tests
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: |
          rm -f LIVE_SMOKE_REPORT.md
          node scripts/live-smoke-v2.mjs

      - name: Live final platform feature tests
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-final-features-smoke.mjs

      - name: Live Nibiru academic growth tests
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-academic-growth-smoke.mjs

      - name: Live Standard package acceptance
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-standard-smoke.mjs

      - name: Live Standard final closure
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-standard-closure-smoke.mjs

      - name: Live counselor-approved guidance governance
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-guidance-governance-smoke.mjs

      - name: Live official education knowledge trust
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-official-knowledge-smoke.mjs

      - name: Live content and question provenance
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-content-question-backbone-smoke.mjs

      - name: Optional live Nibiru voice activation
        continue-on-error: true
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: node scripts/live-nibiru-voice-smoke.mjs

      - name: Persist live smoke report
        if: ${{ always() && vars.CLOUDFLARE_LOAD_DEMO == 'true' }}
        run: |
          if [ ! -f LIVE_SMOKE_REPORT.md ]; then
            echo "# Live Staging Smoke Report" > LIVE_SMOKE_REPORT.md
            echo >> LIVE_SMOKE_REPORT.md
            echo "Smoke report was not produced by the test runner." >> LIVE_SMOKE_REPORT.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_SMOKE_REPORT.md
          if git diff --cached --quiet; then
            echo "Smoke report unchanged."
          else
            git commit -m "chore: update live smoke report [skip ci]"
            git push
          fi
