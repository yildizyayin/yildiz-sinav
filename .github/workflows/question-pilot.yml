name: Question Pilot Setup
on:
  push:
    branches: [feat/question-pilot-20261013]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: question-pilot-readiness
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      QUESTION_PILOT_IMPORT_OFFICIAL: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/live-question-pilot-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-pilot-audit-${{ github.sha }}
          path: tmp/question-pilot/
