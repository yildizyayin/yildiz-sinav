name: Question team editorial and focused pilot
on:
  push:
    branches: [staging]
    paths: [.github/question-team-quality.execute]
permissions:
  contents: read
concurrency:
  group: question-team-quality
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Correct frozen drafts and run only two focused jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-team-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-team-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: tmp/question-team-quality/
