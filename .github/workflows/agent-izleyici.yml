name: "Ajan 1 - İzleyici (Uptime & Hata Tarayıcı)"

# Production ve yayınlanmış alt alan adlarını 7/24 izler. Bir erişim
# problemi tespit edilirse aynı arızayı temsil eden açık Issue'yu günceller;
# açık Issue yoksa yeni bir acil Issue oluşturur.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: izleyici-ajan
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    steps:
      - name: Domainleri kontrol et
        id: check
        shell: bash
        run: |
          set -euo pipefail

          URLS=(
            "https://anunex.com"
            "https://www.anunex.com"
            "https://app.anunex.com"
            "https://demo.anunex.com"
            "https://sonuc.anunex.com"
          )

          failures_file="$(mktemp)"
          trap 'rm -f "$failures_file"' EXIT

          for url in "${URLS[@]}"; do
            status="$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 20 \
              --retry 2 \
              --retry-delay 2 \
              "$url" 2>/dev/null || true)"
            status="${status:-000}"
            echo "$url -> $status"

            if [[ ! "$status" =~ ^[0-9]{3}$ ]] || (( 10#$status >= 400 )); then
              printf '%s\n' "- $url -> HTTP $status" >> "$failures_file"
            fi
          done

          if [[ -s "$failures_file" ]]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failures<<EOF"
              cat "$failures_file"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sorun varsa Issue aç veya güncelle
        if: steps.check.outputs.has_failures == 'true'
        env:
          FAILURES: ${{ steps.check.outputs.failures }}
        uses: actions/github-script@v7
        with:
          script: |
            const failures = process.env.FAILURES || "Durum ayrıntısı üretilemedi.";
            const title = `🔴 İzleyici Ajanı: Erişim sorunu tespit edildi (${new Date().toISOString()})`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "izleyici-ajan",
              per_page: 10,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Tekrar tespit edildi (${new Date().toISOString()}):\n${failures}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["izleyici-ajan", "acil"],
                body: [
                  "**İzleyici Ajanı otomatik raporu**",
                  "",
                  "Aşağıdaki adreslerde erişim sorunu tespit edildi:",
                  failures,
                  "",
                  "_Bu Issue otomatik olarak GitHub Actions tarafından açıldı (agent-izleyici.yml)._",
                ].join("\n"),
              });
            }

      - name: Sahibine SMS/WhatsApp bildirimi gönder
        if: ${{ steps.check.outputs.has_failures == 'true' }}
        uses: ./.github/actions/sana-bildir
        env:
          ONAY_WORKER_URL: ${{ vars.ONAY_WORKER_URL }}
          ONAY_WORKER_SECRET: ${{ secrets.ONAY_WORKER_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ vars.TWILIO_FROM_NUMBER }}
          TWILIO_WHATSAPP_FROM: ${{ vars.TWILIO_WHATSAPP_FROM }}
          SAHIP_TELEFON_NUMARASI: ${{ vars.SAHIP_TELEFON_NUMARASI }}
        with:
          baslik: "Site erişim sorunu"
          aciklama: "İzleyici ajanı bir veya birden fazla domain'de sorun tespit etti"
          action_type: "info_only"
