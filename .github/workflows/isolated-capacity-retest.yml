name: Bounded authenticated capacity diagnostics
on:
  push:
    branches: [fix/post-release-technical-acceptance]
    paths: ['.github/workflows/isolated-capacity-retest.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-capacity-retest
  cancel-in-progress: false
jobs:
  proven-product-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SHA: ${{ github.sha }}
    steps:
      - name: Require passed live acceptance and identical product source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://api.github.com/repos/yildizyayin/yildiz-sinav';
          async function get(path){const r=await fetch(base+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});assert(r.ok,'Cannot verify acceptance evidence: HTTP '+r.status);return r.json()}
          const run=await get('/actions/runs/37902532033');
          assert.equal(run.head_branch,'fix/post-release-technical-acceptance');
          const deadline=Date.now()+600000;
          while(true){
            const {jobs}=await get('/actions/runs/37902532033/jobs?per_page=100');
            const required=['native-browser','provider-inventory','isolated-private-reports'].map(name=>jobs.find(j=>j.name===name));
            assert(required.every(Boolean),'Missing required acceptance gate');
            assert(!required.some(j=>j.status==='completed'&&j.conclusion!=='success'),'Required live acceptance failed');
            if(required.every(j=>j.conclusion==='success'))break;
            assert(Date.now()<deadline,'Acceptance gates are still pending');
            await new Promise(resolve=>setTimeout(resolve,30000));
          }
          async function source(sha){const commit=await get('/git/commits/'+sha);const tree=await get('/git/trees/'+commit.tree.sha);return Object.fromEntries(tree.tree.map(e=>[e.path,e.sha]))}
          const [proof,current]=await Promise.all([source(run.head_sha),source(process.env.CURRENT_SHA)]);
          for(const path of ['worker','src','migrations','package.json','vite.config.ts'])assert.equal(current[path],proof[path],'Product source differs from live evidence: '+path);
          console.log(JSON.stringify({status:'passed',liveAcceptanceRun:run.id,proofHead:run.head_sha,currentHead:process.env.CURRENT_SHA,scope:'same product source; native browser, private provider and six-role acceptance passed; only corrected k6 load is repeated'}));
          JS
  capacity-start:
    needs: proven-product-source
    runs-on: ubuntu-latest
    outputs:
      start_at: ${{ steps.start.outputs.start_at }}
    steps:
      - id: start
        run: echo "start_at=$(($(date +%s%3N) + 90000))" >> "$GITHUB_OUTPUT"
      - name: Record exact free-plan proof boundary
        run: |
          {
            echo '### Staging authenticated capacity boundary'
            echo '- Diagnostic only: one generator × 100 virtual users after failed 10,000-request burst.'
            echo '- One synthetic identity; this bounded run does not certify 10,000 users.'
            echo '- 1,000,000 HTTP requests BLOCKED: provider reported Workers Free; daily dynamic request allowance is 100,000.'
            echo '- This is not a sustained 60-second capacity certification or one million simultaneous users.'
          } >> "$GITHUB_STEP_SUMMARY"
  authenticated-burst:
    needs: capacity-start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CAPACITY_SHARD: ${{ matrix.shard }}
      CAPACITY_START_AT: ${{ needs.capacity-start.outputs.start_at }}
      SMOKE_BASE_URL: https://yildiz-sinav-qpool-pr-227.rtsgida.workers.dev
      TARGET_URL: https://yildiz-sinav-qpool-pr-227.rtsgida.workers.dev
      LOAD_TEST_ALLOWED_ORIGINS: https://yildiz-sinav-qpool-pr-227.rtsgida.workers.dev
      VUS: '100'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate exact isolated staging target
        run: node scripts/agents/load-target.mjs
      - name: Install official k6
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | tar xz --strip-components 1
      - name: Install bounded diagnostic script (100 requests, status only)
        run: |
          cat > bounded-capacity-diagnostic.js <<'JS'
          import http from 'k6/http';
          import {check,sleep} from 'k6';
          import {Trend,Counter} from 'k6/metrics';
          const responses=new Counter('response_status');
          const failures=new Counter('response_failure_kind');
          const launchDelay=new Trend('launch_delay_ms');
          export const options={
           scenarios:{authenticated_burst:{executor:'per-vu-iterations',vus:100,iterations:1,maxDuration:'5m'}},
           thresholds:{http_req_failed:['rate<0.05'],http_req_duration:['p(95)<2500'],checks:['rate>0.99'],launch_delay_ms:['p(99)<2000']},
          };
          export default function(){
           const start=Number(__ENV.CAPACITY_START_AT);if(!start)throw new Error('Coordinated start time is required');
           const wait=start-Date.now();if(wait>0)sleep(wait/1000);launchDelay.add(Math.max(0,Date.now()-start));
           const res=http.get(`${__ENV.TARGET_URL}/api/public/results/student`,{headers:{Cookie:__ENV.RESULT_LOAD_COOKIE},redirects:0,timeout:'30s'});
           responses.add(1,{status:String(res.status)});
           if(res.status!==200){
            let kind='UNCLASSIFIED';
            try{const body=JSON.parse(res.body);const candidate=String(body.code||(body.error && body.error.code)||'');if(/^[A-Z0-9_]{1,64}$/.test(candidate))kind=candidate;}catch(error){}
            if(/D1.*(overload|busy|too many)/i.test(res.body||''))kind='D1_OVERLOAD';
            if(/Error (1102|1027)/.test(res.body||''))kind='WORKER_RESOURCE_LIMIT';
            failures.add(1,{kind});
            console.log(JSON.stringify({status:res.status,failureKind:kind}));
           }
           check(res,{'authenticated summary 200':r=>r.status===200,'exact synthetic published exam and net':r=>{try{const data=JSON.parse(r.body);return data.ok===true&&data.exams.length===1&&data.exams[0].exam_id===__ENV.RESULT_EXPECTED_EXAM_ID&&data.exams[0].net===7.5}catch(error){return false}}});
          }
          
          JS
      - name: Validate diagnostic k6 syntax before synthetic writes
        run: ./k6 inspect bounded-capacity-diagnostic.js > /dev/null
      - name: Recover only failed run 37903414741 synthetic fixtures
        run: |
          set -euo pipefail
          for shard in {1..10}; do
            cleaned=false
            for attempt in {1..6}; do
              if GITHUB_RUN_ID=37903414741 CAPACITY_SHARD="$shard" node scripts/isolated-result-capacity-fixture.mjs --cleanup; then cleaned=true; break; fi
              sleep $((attempt * 5))
            done
            test "$cleaned" = true
          done
      - name: Prepare one synthetic published result using the real access-issuance API
        run: node scripts/isolated-result-capacity-fixture.mjs
      - name: Complete actual result lookup and HMAC code verification
        run: node scripts/prepare-authenticated-result-load.mjs
      - name: Execute bounded 100-VU authenticated diagnostic
        run: ./k6 run --summary-export=capacity-shard-${{ matrix.shard }}.json bounded-capacity-diagnostic.js
      - name: Preserve exact metrics without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-shard-${{ matrix.shard }}
          path: capacity-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
      - name: Remove only this generator's synthetic data
        if: always()
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if node scripts/isolated-result-capacity-fixture.mjs --cleanup; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
