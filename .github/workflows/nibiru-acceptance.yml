name: Nibiru Bounded Acceptance
on:
  push:
    branches: [fix/nibiru-acceptance-20261009]
    paths:
      - 'worker/**'
      - 'src/**'
      - 'tests/**'
      - 'acceptance/**'
      - 'scripts/check-nibiru-free-account.mjs'
      - 'scripts/nibiru-free-subscription-policy.mjs'
      - 'scripts/nibiru-demo-readiness.mjs'
      - '.github/workflows/nibiru-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nibiru-bounded-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read demo WhatsApp and voice configuration without sending messages
        run: node scripts/nibiru-demo-readiness.mjs
      - name: Verify Free account before inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-nibiru-free-account.mjs
      - name: Generate synthetic Turkish speech locally (no TTS API)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          mkdir -p tmp/nibiru-acceptance
          espeak-ng -v tr -s 130 -w tmp/nibiru-acceptance/turkish-fixture.wav 'Bugün matematik çalışacağım.'
      - name: Real providers, education and STT (maximum ten requests)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vitest run --config acceptance/vitest.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nibiru-bounded-acceptance-${{ github.sha }}
          path: tmp/nibiru-acceptance/
          if-no-files-found: warn
