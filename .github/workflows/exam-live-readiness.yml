name: Exam Live Readiness Read Only
on:
  push:
    branches: [fix/exam-live-readiness-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify public endpoints, private denial and deployed demo assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('dist/client/.vite/manifest.json','utf8'));
          const expected=manifest['index.html'].file;
          for(const host of ['app.anunex.com','demo.anunex.com','sonuc.anunex.com']){
            const base='https://'+host;
            const health=await fetch(base+'/api/health',{signal:AbortSignal.timeout(20000)});
            assert.equal(health.status,200,host+' health');
            assert.equal((await health.json()).ok,true);
            console.log('PASS '+host+' public health');
          }
          const base='https://demo.anunex.com';
          for(const path of ['/api/exam-definitions','/api/nibiru/identity','/api/calendar']){
            const response=await fetch(base+path,{signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,401,path+' must require authentication');
            console.log('PASS demo private data denied '+path);
          }
          const html=await (await fetch(base+'/nibiru-direct',{signal:AbortSignal.timeout(20000)})).text();
          assert(html.includes(expected),'Demo does not serve accepted release entry');
          const asset=await fetch(base+'/'+expected,{signal:AbortSignal.timeout(20000)});
          assert.equal(asset.status,200);
          console.log('PASS demo serves accepted release bundle '+expected);
          console.log('Scope: public/read-only acceptance. No account login, personal data, exam writes, AI inference or outbound messages.');
          JS
