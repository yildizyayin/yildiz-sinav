name: Nibiru Read-only Account Audit
on:
  push:
    branches: [fix/nibiru-acceptance-20261009]
    paths: ['.github/workflows/nibiru-account-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect subscription products (no model requests)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/subscriptions',{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const body=await response.json();
          if(!response.ok||body.success!==true||!Array.isArray(body.result))throw new Error('SUBSCRIPTION_READ_HTTP_'+response.status);
          const products=body.result.map(row=>({
            product:row.rate_plan?.public_name||row.rate_plan?.name||'UNKNOWN',
            plan:row.rate_plan?.id||'UNKNOWN',
            paidPrice:Number(row.price)>0||Number(row.rate_plan?.price)>0,
            status:row.state||'UNKNOWN',
            paidNamePattern:/paid|standard|enterprise|business|pro/i.test(String(row.rate_plan?.public_name||row.rate_plan?.name||'')),
          }));
          console.log(JSON.stringify({inferenceCalls:0,products}));
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37965077065
          name: nibiru-bounded-acceptance-8fc6aca373e8da68d78751340a390d114e99fe0e
          path: tmp/provider-evidence
      - name: Inspect synthetic provider evidence (no inference)
        run: |
          node --input-type=module -e "import fs from 'node:fs';console.log(fs.readFileSync('tmp/provider-evidence/providers.json','utf8'))"

      - name: Diagnose demo logout using only the test account
        run: |
          node --input-type=module <<'JS'
          const base='https://demo.anunex.com';
          const config=await (await fetch(base+'/api/config')).json();
          if(config.environment!=='staging')throw new Error('STAGING_REQUIRED');
          const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:'manager',password:'Demo123!',remember:false,turnstileToken:'XXXX.DUMMY.TOKEN.XXXX'})});
          const cookie=(login.headers.get('set-cookie')||'').match(/yildiz_session=[^;]+/)?.[0];
          if(!login.ok||!cookie)throw new Error('DEMO_TEST_LOGIN_FAILED');
          const logout=await fetch(base+'/api/auth/logout',{method:'POST',headers:{'content-type':'application/json',cookie},body:'{}'});
          const body=await logout.json().catch(()=>null);
          const code=String(body?.error?.code||'').replace(/[^A-Z0-9_]/g,'').slice(0,80);
          const after=await fetch(base+'/api/auth/me',{headers:{cookie}});
          console.log(JSON.stringify({logoutStatus:logout.status,errorCode:code||null,sessionInvalidated:after.status===401,authAfterLogoutStatus:after.status,clearingCookie:Boolean(logout.headers.get('set-cookie')?.includes('Max-Age=0'))}));
          JS

      - name: Inspect only the demo logout error category (temporary tail)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/yildiz-sinav-v1/tails';
          const headers={authorization:'Bearer '+token};
          const response=await fetch(endpoint,{method:'POST',headers,signal:AbortSignal.timeout(20000)});
          const body=await response.json().catch(()=>null);
          if(!response.ok||!body?.result?.url){console.log(JSON.stringify({tailAvailable:false,httpStatus:response.status}));process.exit(0);}
          let ws;
          try{
            ws=new WebSocket(body.result.url,'trace-v1');ws.binaryType='arraybuffer';
            const errors=[];
            ws.onmessage=event=>{
              try{
                const text=typeof event.data==='string'?event.data:new TextDecoder().decode(event.data);
                const item=JSON.parse(text);
                if(new URL(item.event?.request?.url||'https://invalid').pathname!=='/api/auth/logout')return;
                for(const log of item.logs||[]){
                  for(const part of log.message||[]){
                    try{const value=JSON.parse(part);if(value.error)errors.push({id:value.requestId,message:String(value.error)});}catch{if(log.level==='error')errors.push({id:null,message:String(part)});}
                  }
                }
              }catch{}
            };
            await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('TAIL_TIMEOUT')),10000);ws.onopen=()=>{ws.send(JSON.stringify({debug:false}));clearTimeout(timer);resolve()};ws.onerror=()=>{clearTimeout(timer);reject(new Error('TAIL_UNAVAILABLE'))};});
            const base='https://demo.anunex.com';
            const config=await (await fetch(base+'/api/config')).json();
            if(config.environment!=='staging')throw new Error('STAGING_REQUIRED');
            const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:'manager',password:'Demo123!',remember:false,turnstileToken:'XXXX.DUMMY.TOKEN.XXXX'})});
            const cookie=(login.headers.get('set-cookie')||'').match(/yildiz_session=[^;]+/)?.[0];
            if(!login.ok||!cookie)throw new Error('DEMO_TEST_LOGIN_FAILED');
            const logout=await fetch(base+'/api/auth/logout',{method:'POST',headers:{'content-type':'application/json',cookie},body:'{}'});
            const id=logout.headers.get('x-request-id');
            await new Promise(resolve=>setTimeout(resolve,5000));
            const own=errors.filter(item=>item.id===id||!item.id);
            const categories=own.map(item=>({
              safeError:item.message.replace(/https?:\/\/\S+|Bearer\s+\S+/g,'[redacted]').replace(/\b[A-Za-z0-9_-]{24,}\b/g,'[redacted]').replace(/\b\d{7,}\b/g,'[redacted]').slice(0,350),
              databaseCodes:item.message.match(/D1_[A-Z_]+|SQLITE_[A-Z_]+/g)||[],
              missingObject:item.message.match(/no such (?:table|column): [a-zA-Z0-9_.]+/)?.[0]||null,
              undefinedBinding:/undefined.*not supported|Cannot read properties of undefined/.test(item.message),
              referenceError:item.message.match(/[a-zA-Z_$][a-zA-Z0-9_$.]* is not defined/)?.[0]||null,
            }));
            console.log(JSON.stringify({tailAvailable:true,logoutStatus:logout.status,matchingErrors:own.length,categories}));
          }catch{console.log(JSON.stringify({tailAvailable:false,code:'TAIL_DIAGNOSTIC_FAILED'}));}
          finally{
            ws?.close();
            const cleanup=await fetch(endpoint+'/'+body.result.id,{method:'DELETE',headers,signal:AbortSignal.timeout(20000)});
            console.log(JSON.stringify({temporaryTailRemoved:cleanup.ok}));
            process.exit(cleanup.ok?0:1);
          }
          JS
