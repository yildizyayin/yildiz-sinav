name: Question team editorial balance
on:
  push:
    branches: [staging]
    paths: [.github/question-team-balance.execute]
permissions:
  contents: read
concurrency:
  group: question-team-balance
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Edit and reverify six frozen drafts without new generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-team-balance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-team-balance-${{ github.sha }}-${{ github.run_attempt }}
          path: tmp/question-team-balance/
