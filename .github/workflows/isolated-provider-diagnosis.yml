name: Isolated read-only failure diagnosis
on:
  push:
    branches: [fix/post-release-technical-acceptance]
    paths: [.github/workflows/isolated-provider-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect exact disposable database and restored schedules without writes
        run: |
          python3 <<'PY'
          import json,os,urllib.request,urllib.error
          account='daae7254acbfe5218c52665daaacbd96'
          db='8db26532-eb50-42c9-99f3-00f097127c11'
          assert os.environ['CLOUDFLARE_ACCOUNT_ID']==account
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def api(path,payload=None):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},data=None if payload is None else json.dumps(payload).encode())
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              except urllib.error.HTTPError as error:
                  try: data=json.load(error)
                  except Exception: data={}
                  messages=' '.join(str(e.get('message','')) for e in data.get('errors',[])).lower()
                  category='DAILY_LIMIT' if any(x in messages for x in ['daily','quota','read limit','write limit']) else 'OVERLOAD' if 'overload' in messages else 'OTHER'
                  print(json.dumps({'providerStatus':error.code,'codes':[e.get('code') for e in data.get('errors',[])],'category':category}))
                  return None
              if not data.get('success'):
                  print(json.dumps({'providerRejected':True,'codes':[e.get('code') for e in data.get('errors',[])]}))
                  return None
              return data['result']
          metadata=api('/d1/database/'+db)
          assert metadata and metadata['name']=='yildiz-sinav-qpool-pr-227-generation-v2'
          for worker in ['yildiz-sinav-qpool-pr-227','yildiz-sinav-v1']:
              data=api('/workers/scripts/'+worker+'/schedules')
              print(json.dumps({'worker':worker,'schedules':None if data is None else [x['cron'] for x in data['schedules']]}))
          queries=[
            ('database-clock','SELECT CURRENT_TIMESTAMP AS databaseTime,1 AS available'),
            ('rubric-retention-counts',"SELECT status,cleanup_done,count(*) AS jobCount,sum(CASE WHEN datetime(expires_at)<=CURRENT_TIMESTAMP THEN 1 ELSE 0 END) AS expiredCount FROM private_rubric_export_jobs GROUP BY status,cleanup_done"),
            ('cohort-retention-counts',"SELECT status,cleanup_done,count(*) AS jobCount,sum(CASE WHEN datetime(expires_at)<=CURRENT_TIMESTAMP THEN 1 ELSE 0 END) AS expiredCount FROM private_cohort_report_jobs GROUP BY status,cleanup_done")
          ]
          for label,query in queries:
              result=api('/d1/database/'+db+'/query',{'sql':query,'params':[]})
              if result is not None:
                  for row in result:
                      print(json.dumps({'scope':label,'success':row.get('success'),'meta':row.get('meta'),'aggregates':row.get('results',[])}))
          req=urllib.request.Request('https://yildiz-sinav-qpool-pr-227.rtsgida.workers.dev/api/config')
          with urllib.request.urlopen(req,timeout=30) as response:
              config=json.load(response)
          assert config.get('environment')=='staging'
          print('PASS: read-only isolated diagnosis; no deployment or schedule mutation')
          PY
