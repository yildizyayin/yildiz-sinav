name: Isolated provider failure diagnosis
on:
  push:
    branches: [fix/post-release-technical-acceptance]
    paths: [.github/workflows/isolated-provider-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect exact disposable database and restored schedules without writes
        run: |
          python3 <<'PY'
          import json,os,urllib.request,urllib.error
          account='daae7254acbfe5218c52665daaacbd96'
          db='8db26532-eb50-42c9-99f3-00f097127c11'
          assert os.environ['CLOUDFLARE_ACCOUNT_ID']==account
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def api(path,payload=None):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},data=None if payload is None else json.dumps(payload).encode())
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              except urllib.error.HTTPError as error:
                  try: data=json.load(error)
                  except Exception: data={}
                  messages=' '.join(str(e.get('message','')) for e in data.get('errors',[])).lower()
                  category='DAILY_LIMIT' if any(x in messages for x in ['daily','quota','read limit','write limit']) else 'OVERLOAD' if 'overload' in messages else 'OTHER'
                  print(json.dumps({'providerStatus':error.code,'codes':[e.get('code') for e in data.get('errors',[])],'category':category}))
                  return None
              if not data.get('success'):
                  print(json.dumps({'providerRejected':True,'codes':[e.get('code') for e in data.get('errors',[])]}))
                  return None
              return data['result']
          metadata=api('/d1/database/'+db)
          assert metadata and metadata['name']=='yildiz-sinav-qpool-pr-227-generation-v2'
          for worker in ['yildiz-sinav-qpool-pr-227','yildiz-sinav-v1']:
              data=api('/workers/scripts/'+worker+'/schedules')
              print(json.dumps({'worker':worker,'schedules':None if data is None else [x['cron'] for x in data['schedules']]}))
          queries=[
            ('database-clock','SELECT CURRENT_TIMESTAMP AS databaseTime,1 AS available'),
            ('rubric-retention-counts',"SELECT status,cleanup_done,count(*) AS jobCount,sum(CASE WHEN datetime(expires_at)<=CURRENT_TIMESTAMP THEN 1 ELSE 0 END) AS expiredCount FROM private_rubric_export_jobs GROUP BY status,cleanup_done"),
            ('cohort-retention-counts',"SELECT status,cleanup_done,count(*) AS jobCount,sum(CASE WHEN datetime(expires_at)<=CURRENT_TIMESTAMP THEN 1 ELSE 0 END) AS expiredCount FROM private_cohort_report_jobs GROUP BY status,cleanup_done")
          ]
          for label,query in queries:
              result=api('/d1/database/'+db+'/query',{'sql':query,'params':[]})
              if result is not None:
                  for row in result:
                      print(json.dumps({'scope':label,'success':row.get('success'),'meta':row.get('meta'),'aggregates':row.get('results',[])}))
          print('PASS: read-only isolated diagnosis; no deployment or schedule mutation')
          PY
      - name: Classify one synthetic parser request without printing private payloads
        run: |
          set -euo pipefail
          mkdir -p tmp
          cat > tmp/classify.py <<'PY'
          import json,sys
          decoder=json.JSONDecoder();buffer=''
          for line in sys.stdin:
              if not buffer.strip() and not line.lstrip().startswith('{'): continue
              buffer+=line
              while buffer.strip():
                  buffer=buffer.lstrip()
                  try: event,end=decoder.raw_decode(buffer)
                  except json.JSONDecodeError: break
                  buffer=buffer[end:]
                  text=json.dumps(event).lower()
                  category='DAILY_LIMIT' if any(x in text for x in ['daily limit','daily row','exceeded your','daily read','daily write']) else 'D1_OVERLOAD' if 'overloaded' in text else 'CPU_LIMIT' if 'cpu' in str(event.get('outcome','')).lower() else 'OTHER'
                  print(json.dumps({'eventOutcome':event.get('outcome'),'category':category,'exceptionCount':len(event.get('exceptions',[]))}),flush=True)
          PY
          npx --yes wrangler@4.131.1 tail yildiz-sinav-qpool-pr-227 --format json 2>/dev/null | python3 tmp/classify.py > tmp/classifications.jsonl &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true; cat tmp/classifications.jsonl' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {setTimeout as pause} from 'node:timers/promises';
          await pause(15000);
          const base='https://yildiz-sinav-qpool-pr-227.rtsgida.workers.dev';
          const headers={'content-type':'application/json','user-agent':'ANUNEX-synthetic-acceptance/1.0'};
          const config=await fetch(base+'/api/config',{headers});assert.equal(config.status,200);
          assert.equal((await config.json()).environment,'staging');
          const login=await fetch(base+'/api/auth/login',{method:'POST',headers,body:JSON.stringify({identifier:'super',password:'Demo123!',turnstileToken:'XXXX.DUMMY.TOKEN.XXXX'})});
          console.log(JSON.stringify({probe:'synthetic-login',status:login.status}));
          assert.equal(login.status,200);
          const cookie=login.headers.get('set-cookie')?.split(';')[0];assert(cookie);console.log('::add-mask::'+cookie);
          const sampleText='student_number,name,class,booklet,answers_MAT,answers_TUR,answers_FEN\n1001,Aktif1 Öğrenci1,7/A,A,ABCDEABCDE,ABCDEABCDE,ABCDEABCDE\n';
          const result=await fetch(base+'/api/optical-definition-versions/optv_demo/test-parser',{method:'POST',headers:{...headers,cookie},body:JSON.stringify({sampleText,fileName:'synthetic-parser-proof.csv'})});
          let data;try{data=await result.json()}catch{}
          console.log(JSON.stringify({probe:'synthetic-parser',status:result.status,errorCode:data?.error?.code,passed:data?.passed}));
          await pause(5000);
          assert.equal(result.status,200);
          JS
