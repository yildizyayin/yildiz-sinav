name: Tanıtım ortamı (tanitim.anunex.com)

# Owner (11 Nov 2026): a separate showcase for field sales from December 2026 — its own Worker and D1, the 2027–2028
# season, invented data only, no AI binding, no scheduled jobs. "deploy" updates the code (migrations + Worker);
# "reset" deletes the showcase database and builds it again from the migrations, the verified 2027–2028 MEB programs
# (read-only copy from production; public data) and scripts/generate-tanitim-seed.mjs. "content" reloads the TANITIM
# activities (scripts/generate-tanitim-content.mjs) and the TANITIM exams (scripts/tanitim-exams.sql, made from the real
# exam flow on invented answers) without touching anything else.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy: yalnız kodu güncelle · reset: veritabanını sıfırla ve tanıtım verisini yeniden kur · content: TANITIM etkinliklerini ve denemelerini yeniden yükle'
        type: choice
        options: [deploy, reset, content]
        default: deploy

permissions:
  contents: read

concurrency:
  group: tanitim-environment
  cancel-in-progress: false

jobs:
  tanitim:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEMO_PASSWORD: ${{ secrets.TANITIM_PASSWORD }}
      DB_NAME: anunex-tanitim-db
      WORKER: anunex-tanitim
      HOSTNAME_TANITIM: tanitim.anunex.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install and build
        run: npm install --no-audit --no-fund && npm run build

      - name: Find or (re)create the showcase database
        id: db
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          find_id() { curl --fail-with-body --silent --show-error --header "$auth" "$api?name=$DB_NAME" | jq -r --arg n "$DB_NAME" '.result[] | select(.name == $n) | .uuid' | head -1; }
          id="$(find_id)"
          if [ -n "$id" ] && [ "${{ inputs.mode }}" = "reset" ]; then
            curl --fail-with-body --silent --show-error --request DELETE --header "$auth" "$api/$id" >/dev/null
            echo "Showcase database deleted for a clean reset."
            id=""
          fi
          fresh=false
          if [ -z "$id" ]; then
            curl --fail-with-body --silent --show-error --request POST --header "$auth" --header 'Content-Type: application/json' \
              --data "$(jq -n --arg n "$DB_NAME" '{name:$n}')" "$api" >/dev/null
            id="$(find_id)"
            fresh=true
          fi
          test -n "$id" || (echo "Showcase database could not be created." >&2 && exit 1)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          jq --arg id "$id" '.d1_databases[0].database_id=$id' <(sed 's#^\s*//.*##' wrangler.tanitim.jsonc) > wrangler.tanitim.resolved.json

      - name: Ensure the showcase file bucket
        run: npx wrangler r2 bucket create anunex-tanitim-files || echo "Bucket already exists."

      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.tanitim.resolved.json

      - name: Copy the verified 2027–2028 MEB programs (read-only from production)
        if: steps.db.outputs.fresh == 'true'
        shell: bash
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          detail="$(curl --fail-with-body --silent --show-error --header "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/yildiz-sinav-prod/settings")"
          prod_id="$(jq -r '.result.bindings[] | select(.name == "DB" and .type == "d1") | .database_id // .id // empty' <<<"$detail")"
          test -n "$prod_id" || (echo "Production database could not be resolved." >&2 && exit 1)
          prod_name="$(curl --fail-with-body --silent --show-error --header "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$prod_id" | jq -r '.result.name')"
          mkdir -p tmp
          # a throw-away config naming the production database, used only for the three SELECTs below
          jq -n --arg n "$prod_name" --arg id "$prod_id" '{name:"tanitim-curricula-read",compatibility_date:"2026-08-26",d1_databases:[{binding:"PROD",database_name:$n,database_id:$id}]}' > tmp/prod-read.json
          read_prod() { npx wrangler d1 execute PROD --remote --json --config tmp/prod-read.json --command "$1"; }
          read_prod "SELECT * FROM subjects" > tmp/subjects.json
          read_prod "SELECT * FROM curriculum_versions WHERE verified=1 AND academic_year='2027-2028'" > tmp/versions.json
          read_prod "SELECT o.* FROM outcomes o JOIN curriculum_versions cv ON cv.id=o.curriculum_version_id WHERE cv.verified=1 AND cv.academic_year='2027-2028'" > tmp/outcomes.json
          node scripts/copy-verified-curricula.mjs tmp/subjects.json tmp/versions.json tmp/outcomes.json > tmp/curricula.sql
          npx wrangler d1 execute DB --remote --file tmp/curricula.sql --config wrangler.tanitim.resolved.json

      - name: Load the showcase school
        if: steps.db.outputs.fresh == 'true'
        run: |
          node scripts/generate-tanitim-seed.mjs
          npx wrangler d1 execute DB --remote --file tmp/tanitim-seed.sql --config wrangler.tanitim.resolved.json

      - name: Load TANITIM activities and exams
        if: steps.db.outputs.fresh == 'true' || inputs.mode == 'content'
        run: |
          node scripts/generate-tanitim-content.mjs
          npx wrangler d1 execute DB --remote --file tmp/tanitim-content.sql --config wrangler.tanitim.resolved.json
          npx wrangler d1 execute DB --remote --file scripts/tanitim-exams.sql --config wrangler.tanitim.resolved.json

      - name: Deploy the showcase Worker
        run: npx wrangler deploy --config wrangler.tanitim.resolved.json --var RELEASE_SHA:${{ github.sha }}

      - name: Session secret
        if: steps.db.outputs.fresh == 'true'
        run: openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_SECRET --config wrangler.tanitim.resolved.json

      - name: Attach tanitim.anunex.com
        shell: bash
        run: |
          response="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --request PUT --header 'Content-Type: application/json' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data "$(jq -n --arg h "$HOSTNAME_TANITIM" --arg s "$WORKER" '{hostname:$h,service:$s,zone_name:"anunex.com"}')" --output "$response"
          jq -e --arg h "$HOSTNAME_TANITIM" '.success == true and .result.hostname == $h' "$response" >/dev/null
          echo "$HOSTNAME_TANITIM attached to $WORKER."

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://$HOSTNAME_TANITIM/api/health" >/dev/null; then echo "tanitim.anunex.com is up."; exit 0; fi
            sleep 10
          done
          echo "tanitim.anunex.com did not answer yet (a new certificate can take a few minutes)."

      - name: Keep the showcase accounts (private artifact)
        if: steps.db.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tanitim-hesaplari
          path: tmp/tanitim-accounts.txt
          retention-days: 7
