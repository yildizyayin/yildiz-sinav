name: "Ücretsiz Ajan - Demo Veri İdempotensi"

on:
  schedule:
    - cron: "30 5 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Demo seed üretimi ve yerel idempotensi
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund; npm run seed:generate; npm run seed:privacy:generate; npx vitest run --config vitest.config.ts tests/seed-idempotency-policy.test.ts tests/demo-mode.test.ts tests/demo-college-showcase.test.ts; } 2>&1 | tee agent-demo-report.md
      - name: Raporu yayınla
        if: always()
        uses: ./.github/actions/agent-report
        with:
          report-file: agent-demo-report.md
          title: "Demo Veri Ajanı Raporu"
          label: "demo-veri-ajani"
          status: ${{ steps.verify.outcome }}
          close-on-success: "true"
          label-color: "0366d6"
      - name: Başarısızsa workflow'u işaretle
        if: steps.verify.outcome == 'failure'
        run: exit 1
