name: "Ücretsiz Ajan - Tenant Güvenlik Denetimi"

on:
  schedule:
    - cron: "30 3 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Yetki ve kurum izolasyonu testleri
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund; npx vitest run --config vitest.config.ts tests/security-boundaries.test.ts tests/access.test.ts tests/production-operations.test.ts; } 2>&1 | tee agent-tenant-report.md
      - name: Raporu yayınla
        if: always()
        uses: ./.github/actions/agent-report
        with:
          report-file: agent-tenant-report.md
          title: "Tenant Güvenlik Ajanı Raporu"
          label: "tenant-guvenlik-ajani"
          status: ${{ steps.verify.outcome }}
          close-on-success: "true"
          label-color: "d93f0b"
      - name: Başarısızsa workflow'u işaretle
        if: steps.verify.outcome == 'failure'
        run: exit 1
