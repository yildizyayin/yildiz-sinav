name: Verify Nemotron chat contract and reasoned deadline
on:
  push:
    branches: [staging]
    paths: [.github/question-solver-contract-fix.execute]
permissions:
  contents: read
concurrency:
  group: question-solver-contract-fix
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Deploy private shared editorial pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-question-production-worker.mjs
      - name: Verify the fixed candidate after the recorded operational failure without a new writer, model editor or pilot slot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-solver-contract-fix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-solver-contract-fix-${{ github.run_id }}
          path: tmp/question-solver-contract-fix/
