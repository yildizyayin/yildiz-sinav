name: Question editor protocol diagnostic
on:
  push:
    branches: [staging]
    paths: [.github/question-editor-diagnostic.execute]
permissions:
  contents: read
concurrency:
  group: question-editor-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Deploy private worker protocol observer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-question-production-worker.mjs
      - name: Observe one bounded editor response without changing question jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-editor-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-editor-diagnostic-${{ github.run_id }}
          path: tmp/question-editor-diagnostic/
