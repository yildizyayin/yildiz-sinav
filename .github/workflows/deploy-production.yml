name: Deploy Production Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TURNSTILE_SITE_KEY: ${{ vars.PROD_TURNSTILE_SITE_KEY }}
      PROD_TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
      PROD_SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
      PROD_WHATSAPP_VERIFY_TOKEN: ${{ secrets.PROD_WHATSAPP_VERIFY_TOKEN }}
      PROD_WHATSAPP_APP_SECRET: ${{ secrets.PROD_WHATSAPP_APP_SECRET }}
      PROD_WHATSAPP_ACCESS_TOKEN: ${{ secrets.PROD_WHATSAPP_ACCESS_TOKEN }}
      PROD_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.PROD_WHATSAPP_PHONE_NUMBER_ID }}
      SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate production secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PROD_TURNSTILE_SITE_KEY" || (echo "Missing PROD_TURNSTILE_SITE_KEY" && exit 1)
          test -n "$PROD_TURNSTILE_SECRET_KEY" || (echo "Missing PROD_TURNSTILE_SECRET_KEY" && exit 1)
          test -n "$PROD_SESSION_SECRET" || (echo "Missing PROD_SESSION_SECRET" && exit 1)
          test -n "$PROD_WHATSAPP_VERIFY_TOKEN" || (echo "Missing PROD_WHATSAPP_VERIFY_TOKEN" && exit 1)
          test -n "$PROD_WHATSAPP_APP_SECRET" || (echo "Missing PROD_WHATSAPP_APP_SECRET" && exit 1)
          test -n "$PROD_WHATSAPP_ACCESS_TOKEN" || (echo "Missing PROD_WHATSAPP_ACCESS_TOKEN" && exit 1)
          test -n "$PROD_WHATSAPP_PHONE_NUMBER_ID" || (echo "Missing PROD_WHATSAPP_PHONE_NUMBER_ID" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Verify release
        run: npm run typecheck && npm test && npm run build

      - name: Deploy isolated production Worker and resources
        run: |
          secret_file="$RUNNER_TEMP/anunex-production-secrets.json"
          node -e "const fs=require('fs');fs.writeFileSync(process.argv[1],JSON.stringify({TURNSTILE_SECRET_KEY:process.env.PROD_TURNSTILE_SECRET_KEY,SESSION_SECRET:process.env.PROD_SESSION_SECRET,WHATSAPP_VERIFY_TOKEN:process.env.PROD_WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET:process.env.PROD_WHATSAPP_APP_SECRET,WHATSAPP_ACCESS_TOKEN:process.env.PROD_WHATSAPP_ACCESS_TOKEN,WHATSAPP_PHONE_NUMBER_ID:process.env.PROD_WHATSAPP_PHONE_NUMBER_ID}))" "$secret_file"
          npx wrangler deploy --config wrangler.production.jsonc --secrets-file "$secret_file" --var ENVIRONMENT:production --var PRODUCT_NAME:"Anunex — Nibiru AI Destekli Ölçme ve Analiz Platformu" --var TURNSTILE_SITE_KEY:$PROD_TURNSTILE_SITE_KEY
          rm -f "$secret_file"

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Live production WhatsApp webhook security checks
        env:
          WHATSAPP_VERIFY_TOKEN: ${{ env.PROD_WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ env.PROD_WHATSAPP_APP_SECRET }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then SMOKE_BASE_URL="https://yildiz-sinav-prod.rtsgida.workers.dev"; export SMOKE_BASE_URL; fi
          node scripts/live-whatsapp-webhook-smoke.mjs

      - name: Production safety note
        run: |
          echo "Production deploy completed without demo seed data."
          echo "Worker: yildiz-sinav-prod"
