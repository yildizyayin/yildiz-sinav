name: Deploy Production Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/releases/anunex-domain-launch

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TURNSTILE_SITE_KEY: ${{ vars.PROD_TURNSTILE_SITE_KEY }}
      PROD_TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
      PROD_SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
      PROD_WHATSAPP_VERIFY_TOKEN: ${{ secrets.PROD_WHATSAPP_VERIFY_TOKEN }}
      PROD_WHATSAPP_APP_SECRET: ${{ secrets.PROD_WHATSAPP_APP_SECRET }}
      PROD_WHATSAPP_ACCESS_TOKEN: ${{ secrets.PROD_WHATSAPP_ACCESS_TOKEN }}
      PROD_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.PROD_WHATSAPP_PHONE_NUMBER_ID }}
      PROD_BASE_URL: https://app.anunex.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate production secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PROD_TURNSTILE_SITE_KEY" || (echo "Missing PROD_TURNSTILE_SITE_KEY" && exit 1)
          test -n "$PROD_TURNSTILE_SECRET_KEY" || (echo "Missing PROD_TURNSTILE_SECRET_KEY" && exit 1)
          test -n "$PROD_SESSION_SECRET" || (echo "Missing PROD_SESSION_SECRET" && exit 1)

      - name: WhatsApp production readiness
        shell: bash
        run: |
          missing=0
          for name in PROD_WHATSAPP_VERIFY_TOKEN PROD_WHATSAPP_APP_SECRET PROD_WHATSAPP_ACCESS_TOKEN PROD_WHATSAPP_PHONE_NUMBER_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured in the production environment."
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Production WhatsApp provider secrets are complete."
          else
            echo "Production deploy may continue, but WhatsApp remains inactive until all four values are configured."
          fi

      - name: Install dependencies
        run: npm install

      - name: Verify release
        run: npm run typecheck && npm test && npm run build

      - name: Deploy isolated production Worker and resources
        run: npx wrangler deploy --config wrangler.production.jsonc --var ENVIRONMENT:production --var PRODUCT_NAME:"Anunex — Nibiru AI Destekli Ölçme ve Analiz Platformu" --var TURNSTILE_SITE_KEY:$PROD_TURNSTILE_SITE_KEY

      - name: Apply production D1 migrations
        shell: bash
        run: |
          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/yildiz-sinav-prod"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          versions="$(curl --fail-with-body --silent --show-error --header "$auth_header" "$api_base/versions")"
          version_id="$(jq -r '.result.items[0].id // .result[0].id // empty' <<<"$versions")"
          test -n "$version_id" || (echo "Production Worker version could not be resolved." >&2 && exit 1)
          detail="$(curl --fail-with-body --silent --show-error --header "$auth_header" "$api_base/versions/$version_id")"
          database_id="$(jq -r '.result.resources.bindings[] | select(.name == "DB" and .type == "d1") | .database_id // .id // empty' <<<"$detail")"
          test -n "$database_id" || (echo "Production D1 binding could not be resolved." >&2 && exit 1)
          npx wrangler d1 migrations apply "$database_id" --remote --yes --config wrangler.production.jsonc

      - name: Set production secrets
        run: |
          printf '%s' "$PROD_TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --config wrangler.production.jsonc
          printf '%s' "$PROD_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.production.jsonc

      - name: Sync WhatsApp secrets to production Worker
        shell: bash
        run: |
          put_prod_secret() {
            local source="$1"
            local target="$2"
            local value="${!source}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$target" --config wrangler.production.jsonc >/dev/null
              echo "$target synced."
            fi
          }
          put_prod_secret PROD_WHATSAPP_VERIFY_TOKEN WHATSAPP_VERIFY_TOKEN
          put_prod_secret PROD_WHATSAPP_APP_SECRET WHATSAPP_APP_SECRET
          put_prod_secret PROD_WHATSAPP_ACCESS_TOKEN WHATSAPP_ACCESS_TOKEN
          put_prod_secret PROD_WHATSAPP_PHONE_NUMBER_ID WHATSAPP_PHONE_NUMBER_ID

      - name: Attach licensed application domain
        shell: bash
        run: |
          attach_domain() {
            local hostname="$1"
            local service="$2"
            local response
            response="$(mktemp)"
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              --request PUT \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data "$(jq -n --arg hostname "$hostname" --arg service "$service" '{hostname:$hostname,service:$service,zone_name:"anunex.com"}')" \
              --output "$response"
            jq -e --arg hostname "$hostname" --arg service "$service" \
              '.success == true and .result.hostname == $hostname and .result.service == $service' "$response" >/dev/null
            rm -f "$response"
            echo "$hostname attached to $service."
          }
          attach_domain app.anunex.com yildiz-sinav-prod

      - name: Read-only production smoke acceptance
        run: node scripts/live-production-smoke.mjs

      - name: Deploy public ANUNEX website
        run: npx wrangler deploy --config wrangler.marketing.jsonc

      - name: Attach public website domains
        shell: bash
        run: |
          attach_domain() {
            local hostname="$1"
            local service="$2"
            local response
            response="$(mktemp)"
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              --request PUT \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data "$(jq -n --arg hostname "$hostname" --arg service "$service" '{hostname:$hostname,service:$service,zone_name:"anunex.com"}')" \
              --output "$response"
            jq -e --arg hostname "$hostname" --arg service "$service" \
              '.success == true and .result.hostname == $hostname and .result.service == $service' "$response" >/dev/null
            rm -f "$response"
            echo "$hostname attached to $service."
          }
          attach_domain anunex.com anunex-web
          attach_domain www.anunex.com anunex-web

      - name: Verify public website
        shell: bash
        run: |
          verify_homepage() {
            local url="$1"
            local body
            body="$(mktemp)"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" --output "$body" \
                && grep -q 'Ölçmenin ötesinde' "$body"; then
                rm -f "$body"
                echo "$url verified."
                return 0
              fi
              sleep 10
            done
            rm -f "$body"
            echo "$url did not serve the ANUNEX public homepage." >&2
            return 1
          }
          verify_homepage https://anunex.com
          verify_homepage https://www.anunex.com

      - name: Production safety note
        run: |
          echo "Production deploy completed without demo seed data."
          echo "Worker: yildiz-sinav-prod"
          echo "Licensed app: https://app.anunex.com"
          echo "Public website: https://anunex.com"
          echo "WhatsApp secrets were synced only when production environment values were present."
