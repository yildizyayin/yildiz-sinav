name: "AI ajan etiketlerini kur"

# İlk merge sonrasında ve gerektiğinde manuel çalıştırılarak ajanların
# kullandığı sabit etiketleri idempotent biçimde oluşturur.

on:
  push:
    branches: [main, codex/ai-agent-team]
    paths:
      - .github/workflows/agent-label-kurulum.yml
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Etiketleri oluştur veya doğrula
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "izleyici-ajan", color: "b60205", description: "Uptime izleyici ajanı" },
              { name: "icerik-tarama-ajani", color: "5319e7", description: "İçerik eksik tarama ajanı" },
              { name: "acil", color: "d93f0b", description: "İnsan müdahalesi gerektiren acil durum" },
              { name: "ajan-talimatı", color: "0366d6", description: "Agent Center üzerinden verilen ücretsiz ajan talimatı" },
              { name: "yuk-testi-ajani", color: "fbca04", description: "Staging yük testi ajanı" },
              { name: "ajan-fix-dene", color: "0e8a16", description: "Kod yazıcı ajanından düşük riskli fix isteği" },
              { name: "ci-saglik-ajani", color: "0e8a16", description: "CI typecheck, test ve build sağlık ajanı" },
              { name: "d1-sema-ajani", color: "5319e7", description: "D1 migration ve şema denetim ajanı" },
              { name: "route-denetim-ajani", color: "fbca04", description: "Route ve Worker entry zinciri denetimi" },
              { name: "tenant-guvenlik-ajani", color: "d93f0b", description: "Tenant ve yetki izolasyonu testleri" },
              { name: "kvkk-denetim-ajani", color: "b60205", description: "KVKK, privacy ve redaksiyon denetimi" },
              { name: "dependency-guvenlik-ajani", color: "5319e7", description: "NPM bağımlılık güvenliği" },
              { name: "frontend-erisim-ajani", color: "a2eeef", description: "Frontend temel erişilebilirlik taraması" },
              { name: "api-saglik-ajani", color: "0e8a16", description: "Public API sağlık endpointleri" },
              { name: "demo-veri-ajani", color: "0366d6", description: "Demo seed ve idempotensi kontrolü" },
              { name: "icerik-kalite-ajani", color: "5319e7", description: "Eksik ve doğrulama bekleyen içerik taraması" },
              { name: "performans-ajani", color: "fbca04", description: "Hafif public GET performans ölçümü" },
              { name: "release-hazirlik-ajani", color: "7057ff", description: "Production release checklist denetimi" },
              { name: "issue-tekillestirme-ajani", color: "c2e0c6", description: "Ajan Issue tekrarlarını bulur" },
              { name: "ajan-durum-raporu", color: "0366d6", description: "Ücretsiz AI ajan ekip durum raporu" },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
            core.info(`Etiketler hazır: ${labels.map(({ name }) => name).join(", ")}`);
