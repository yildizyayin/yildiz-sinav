name: "AI ajan etiketlerini kur"

# İlk merge sonrasında ve gerektiğinde manuel çalıştırılarak ajanların
# kullandığı sabit etiketleri idempotent biçimde oluşturur.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-label-kurulum.yml
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Etiketleri oluştur veya doğrula
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "izleyici-ajan", color: "b60205", description: "Uptime izleyici ajanı" },
              { name: "icerik-tarama-ajani", color: "5319e7", description: "İçerik eksik tarama ajanı" },
              { name: "acil", color: "d93f0b", description: "İnsan müdahalesi gerektiren acil durum" },
              { name: "yuk-testi-ajani", color: "fbca04", description: "Staging yük testi ajanı" },
              { name: "ajan-fix-dene", color: "0e8a16", description: "Kod yazıcı ajanından düşük riskli fix isteği" },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
            core.info(`Etiketler hazır: ${labels.map(({ name }) => name).join(", ")}`);
