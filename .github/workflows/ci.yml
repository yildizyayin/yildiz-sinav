name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to=.wrangler/ci-state
      - name: Validate complete Standard demo seed locally
        run: |
          npm run seed:generate
          npx wrangler d1 execute DB --local --persist-to=.wrangler/ci-state --file=tmp/demo-seed.sql
          npx wrangler d1 execute DB --local --persist-to=.wrangler/ci-state --file=tmp/standard-role-seed.sql
          npx wrangler d1 execute DB --local --persist-to=.wrangler/ci-state --file=scripts/demo-camera-fixture.sql
          npx wrangler d1 execute DB --local --persist-to=.wrangler/ci-state --file=scripts/demo-standard-fixture.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
