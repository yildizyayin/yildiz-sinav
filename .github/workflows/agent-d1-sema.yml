name: "Ücretsiz Ajan - D1 Şema Denetimi"

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Migration sırası ve yerel D1 uygulaması
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > agent-d1-report.md
          node <<'NODE' >> agent-d1-report.md 2>&1
          const fs = require('fs');
          const files = fs.readdirSync('migrations').filter(name => name.endsWith('.sql')).sort();
          const groups = new Map();
          for (const file of files) {
            const version = file.split('_', 1)[0];
            if (!/^\d+$/.test(version)) continue;
            const list = groups.get(version) || [];
            list.push(file);
            groups.set(version, list);
          }

          // These collisions predate the unique-version policy and may already be recorded
          // by D1 under their exact historical filenames. Renaming them can make Wrangler
          // treat old migrations as new, so the immutable filenames are explicitly allowlisted.
          const legacy = new Map(Object.entries({
            '0023': ['0023_coach_mastery_cycle.sql', '0023_student_intelligence_profile.sql'],
            '0024': ['0024_nibiru_whatsapp_public_number.sql', '0024_product_completion_center.sql', '0024_scale_readiness_indexes.sql'],
            '0032': ['0032_approved_theme_catalog.sql', '0032_exam_scoring_presets.sql'],
            '0033': ['0033_publisher_outcome_mapping.sql', '0033_results_network_targets_attendance.sql'],
            '0042': ['0042_official_outcome_matching.sql', '0042_tyt_optional_philosophy.sql'],
            '0043': ['0043_exam_booklet_question_orders.sql', '0043_exam_content_archive.sql'],
            '0045': ['0045_exam_booklet_question_orders.sql', '0045_nibiru_session_routing.sql'],
          }));

          const historical = [];
          const violations = [];
          for (const [version, group] of groups) {
            if (group.length < 2) continue;
            const expected = legacy.get(version);
            const actual = [...group].sort();
            const approved = expected && JSON.stringify(actual) === JSON.stringify([...expected].sort());
            if (approved) historical.push(`${version}: ${actual.join(' + ')}`);
            else violations.push(`${version}: ${actual.join(' + ')}`);
          }

          console.log(`Migration dosyası: ${files.length}`);
          if (historical.length) {
            console.log('Tarihsel/immutable migration çakışmaları (allowlist):');
            console.log(historical.join('\n'));
          }
          if (violations.length) {
            console.log('YENİ veya değişmiş migration sürüm çakışmaları:');
            console.log(violations.join('\n'));
            console.log('Yeni migration dosyaları benzersiz sayısal önek kullanmalıdır. Tarihsel dosyaları yeniden adlandırmayın.');
            process.exitCode = 1;
          } else {
            console.log('Yeni migration sürüm çakışması bulunamadı.');
          }
          NODE
          static_status=$?
          npm install --no-audit --no-fund >> agent-d1-report.md 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npx wrangler d1 migrations apply DB --local --persist-to=.wrangler/agent-d1 >> agent-d1-report.md 2>&1
            d1_status=$?
          else
            d1_status=$install_status
          fi
          if [ "$static_status" -ne 0 ] || [ "$d1_status" -ne 0 ]; then exit 1; fi
          echo "D1 migration kontrolü başarılı." >> agent-d1-report.md
      - name: Raporu yayınla
        if: always()
        uses: ./.github/actions/agent-report
        with:
          report-file: agent-d1-report.md
          title: "D1 Şema Ajanı Raporu"
          label: "d1-sema-ajani"
          status: ${{ steps.verify.outcome }}
          close-on-success: "true"
          label-color: "5319e7"
      - name: Başarısızsa workflow'u işaretle
        if: steps.verify.outcome == 'failure'
        run: exit 1
