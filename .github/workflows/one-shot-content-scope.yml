name: One-shot teacher content scope hardening

on:
  push:
    branches: [hardening/teacher-content-scope]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/teacher-content-scope
          fetch-depth: 0

      - name: Restrict exams, worksheets and optical metadata by role scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker/index.ts')
          s = p.read_text()

          list_exams = r'''async function listExams(env: Env, user: AuthUser, url: URL): Promise<Response> {
  const institutionId = user.role === 'SUPER_ADMIN' ? url.searchParams.get('institutionId') : user.institution_id;
  const params: unknown[] = [];
  let where = `e.status IN ('ACTIVE','CLOSED')`;
  if (institutionId) {
    where += ` AND (e.owner_type='CENTRAL' OR e.institution_id=? OR EXISTS(SELECT 1 FROM exam_institutions ei WHERE ei.exam_id=e.id AND ei.institution_id=? AND ei.enabled=1))`;
    params.push(institutionId, institutionId);
  }

  if ((user.role === 'TEACHER' || user.role === 'GUIDANCE_TEACHER') && institutionId) {
    const seasonId = (await currentSeason(env.DB, institutionId))?.id;
    if (!seasonId) return json({ ok: true, exams: [] });
    if (user.role === 'TEACHER') {
      where += ` AND (
        EXISTS(
          SELECT 1 FROM exam_subjects tes
          JOIN teacher_assignments ta ON ta.subject_id=tes.subject_id AND ta.assignment_type='SUBJECT' AND ta.active=1
          JOIN classes tc ON tc.id=ta.class_id
          WHERE tes.exam_id=e.id AND ta.user_id=? AND ta.season_id=?
            AND (e.grade_level IS NULL OR e.grade_level=tc.grade_level)
        )
        OR EXISTS(
          SELECT 1 FROM teacher_assignments ga
          JOIN classes gc ON gc.id=ga.class_id
          WHERE ga.user_id=? AND ga.season_id=? AND ga.assignment_type='GUIDANCE' AND ga.active=1
            AND (e.grade_level IS NULL OR e.grade_level=gc.grade_level)
        )
      )`;
      params.push(user.id, seasonId, user.id, seasonId);
    } else {
      where += ` AND EXISTS(
        SELECT 1 FROM teacher_assignments ga
        JOIN classes gc ON gc.id=ga.class_id
        WHERE ga.user_id=? AND ga.season_id=? AND ga.assignment_type='GUIDANCE' AND ga.active=1
          AND (e.grade_level IS NULL OR e.grade_level=gc.grade_level)
      )`;
      params.push(user.id, seasonId);
    }
  }

  const rows = await all<any>(env.DB.prepare(`SELECT e.*, srv.verified scoring_verified, sr.authority,
    (SELECT group_concat(code, '/') FROM exam_booklets b WHERE b.exam_id=e.id AND b.active=1) booklet_codes,
    (SELECT count(*) FROM exam_participants ep WHERE ep.exam_id=e.id ${institutionId ? 'AND ep.institution_id=?' : ''}) participant_count
    FROM exams e LEFT JOIN scoring_rule_versions srv ON srv.id=e.scoring_rule_version_id LEFT JOIN scoring_rules sr ON sr.id=srv.rule_id
    WHERE ${where} ORDER BY coalesce(e.exam_date,'9999-12-31') DESC, e.title`).bind(...params, ...(institutionId ? [institutionId] : [])));
  return json({ ok: true, exams: rows });
}
'''

          list_worksheets = r'''async function listWorksheets(env: Env, user: AuthUser, url: URL): Promise<Response> {
  const grade = url.searchParams.get('grade');
  const params: unknown[] = [];
  let where = `w.status='PUBLISHED'`;
  if (grade) { where += ' AND w.grade_level=?'; params.push(Number(grade)); }

  if (user.role === 'STUDENT') {
    if (!user.student_id) return json({ ok: true, worksheets: [] });
    const enrollment = await one<{ grade_level: number | null }>(env.DB.prepare(`SELECT grade_level FROM student_enrollments WHERE student_id=? AND status='ACTIVE' ORDER BY created_at DESC LIMIT 1`).bind(user.student_id));
    if (!enrollment?.grade_level) return json({ ok: true, worksheets: [] });
    where += ' AND w.grade_level=?';
    params.push(enrollment.grade_level);
  }

  if ((user.role === 'TEACHER' || user.role === 'GUIDANCE_TEACHER') && user.institution_id) {
    const seasonId = (await currentSeason(env.DB, user.institution_id))?.id;
    if (!seasonId) return json({ ok: true, worksheets: [] });
    if (user.role === 'TEACHER') {
      where += ` AND (
        EXISTS(
          SELECT 1 FROM worksheet_subjects ws
          JOIN teacher_assignments ta ON ta.subject_id=ws.subject_id AND ta.assignment_type='SUBJECT' AND ta.active=1
          JOIN classes tc ON tc.id=ta.class_id
          WHERE ws.worksheet_id=w.id AND ta.user_id=? AND ta.season_id=?
            AND (w.grade_level IS NULL OR w.grade_level=tc.grade_level)
        )
        OR EXISTS(
          SELECT 1 FROM teacher_assignments ga
          JOIN classes gc ON gc.id=ga.class_id
          WHERE ga.user_id=? AND ga.season_id=? AND ga.assignment_type='GUIDANCE' AND ga.active=1
            AND (w.grade_level IS NULL OR w.grade_level=gc.grade_level)
        )
      )`;
      params.push(user.id, seasonId, user.id, seasonId);
    } else {
      where += ` AND EXISTS(
        SELECT 1 FROM teacher_assignments ga
        JOIN classes gc ON gc.id=ga.class_id
        WHERE ga.user_id=? AND ga.season_id=? AND ga.assignment_type='GUIDANCE' AND ga.active=1
          AND (w.grade_level IS NULL OR w.grade_level=gc.grade_level)
      )`;
      params.push(user.id, seasonId);
    }
  }

  const rows = await all<any>(env.DB.prepare(`SELECT w.*,(SELECT group_concat(s.name, ', ') FROM worksheet_subjects ws JOIN subjects s ON s.id=ws.subject_id WHERE ws.worksheet_id=w.id) subjects FROM worksheets w WHERE ${where} ORDER BY w.academic_year DESC,w.track,w.sequence_no`).bind(...params));
  return json({ ok: true, worksheets: rows });
}
'''

          s, n1 = re.subn(r"async function listExams\(.*?\n}\n\n(?=async function previewExamFile)", list_exams + "\n", s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit('listExams replacement failed')
          s, n2 = re.subn(r"async function listWorksheets\(.*?\n}\n\n(?=async function uploadWorksheetAsset)", list_worksheets + "\n", s, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('listWorksheets replacement failed')

          old = "if (!['SUPER_ADMIN','INSTITUTION_MANAGER','TEACHER','GUIDANCE_TEACHER'].includes(user.role)) return forbidden();\n  const rows = await all<any>(env.DB.prepare(`SELECT t.id template_id"
          new = "if (!roleCanManageInstitution(user.role)) return forbidden();\n  const rows = await all<any>(env.DB.prepare(`SELECT t.id template_id"
          if old not in s:
              raise SystemExit('listOpticalTemplates guard replacement failed')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify
        run: npm install && npm run typecheck && npm test && npm run build

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/one-shot-content-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts .github/workflows/one-shot-content-scope.yml
          git commit -m "security: scope teacher exams and worksheets"
          git push origin HEAD:hardening/teacher-content-scope
