name: "Ajan 5 - Yük Testi"

# Yalnızca staging/test hedefine yük bindirir. Production hostname'leri
# aşağıdaki korumadan geçemez.

on:
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      sanal_kullanici_sayisi:
        description: "Eşzamanlı sanal kullanıcı sayısı"
        default: "1000"
        required: false
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: yuk-testi-ajani
  cancel-in-progress: false

jobs:
  yuk-testi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ secrets.STAGING_URL || vars.STAGING_URL || 'https://demo.anunex.com' }}
      LOAD_TEST_ALLOWED_ORIGINS: ${{ vars.LOAD_TEST_ALLOWED_ORIGINS || 'https://demo.anunex.com' }}
      VUS: ${{ inputs.sanal_kullanici_sayisi || '1000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test hedefini doğrula
        run: node scripts/agents/load-target.mjs

      - name: k6 kur
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz \
            | tar xz --strip-components 1

      - name: Test scriptini oluştur
        run: |
          cat > loadtest.js <<'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '2m', target: Number(__ENV.VUS || 1000) },
              { duration: '5m', target: Number(__ENV.VUS || 1000) },
              { duration: '2m', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<2000'],
              http_req_failed: ['rate<0.05'],
            },
          };

          export default function () {
            const res = http.get(__ENV.TARGET_URL, { redirects: 0 });
            check(res, { 'status 200': (r) => r.status === 200 });
            sleep(1);
          }
          EOF

      - name: Testi çalıştır
        id: k6
        continue-on-error: true
        run: |
          set -euo pipefail
          ./k6 run \
            --env VUS="$VUS" \
            --env TARGET_URL="$TARGET_URL" \
            --summary-export=sonuc.json \
            loadtest.js

      - name: Sonuç raporunu hazırla
        if: always()
        env:
          K6_OUTCOME: ${{ steps.k6.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          let summary = 'Sonuç dosyası yok; test çalışmamış veya başarısız olabilir.';
          try {
            const raw = JSON.parse(fs.readFileSync('sonuc.json', 'utf8'));
            const p95 = raw.metrics?.http_req_duration?.values?.['p(95)'];
            const failRate = raw.metrics?.http_req_failed?.values?.rate;
            if (Number.isFinite(p95) && Number.isFinite(failRate)) summary = `p95: ${p95.toFixed(0)}ms | Hata: ${(failRate * 100).toFixed(2)}%`;
          } catch {}
          fs.writeFileSync('agent-load-report.md', [
            'Ana sayfa GET testi; öğrenci sonuç kapasitesi kanıtı değildir.',
            `Sanal kullanıcı: ${process.env.VUS}`,
            `Çalışma sonucu: ${process.env.K6_OUTCOME || 'çalışmadı'}`,
            summary,
            'Eşik: p95 < 2000ms, hata < %5. Redirect izlenmez.',
          ].join('\n'));
          NODE
      - name: Raporu yayınla
        if: always()
        uses: ./.github/actions/agent-report
        with:
          report-file: agent-load-report.md
          title: "Yük Testi Ajanı Raporu"
          label: "yuk-testi-ajani"
          status: ${{ steps.k6.outcome || 'failure' }}
          close-on-success: "false"

      - name: Eşik başarısızsa workflow'u başarısız yap
        if: ${{ steps.k6.outcome == 'failure' }}
        run: exit 1
