name: Exam Center Readiness Acceptance
on:
  push:
    branches: [fix/exam-readiness-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-center-readiness
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-migration-policy.mjs
      - run: npx wrangler d1 migrations apply DB --local --persist-to=.wrangler/exam-readiness-ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --testTimeout=30000
      - run: npm run build
        id: build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/browser-nibiru-calendar.mjs
      - run: node scripts/browser-exam-readiness.mjs
        if: ${{ always() && steps.build.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-readiness-browser-${{ github.sha }}
          path: |
            tmp/exam-readiness-browser/
            tmp/nibiru-calendar-browser/
          if-no-files-found: warn
