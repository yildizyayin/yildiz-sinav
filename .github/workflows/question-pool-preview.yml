name: Question Pool PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_remote_preview:
        description: 'Create remote D1/R2 preview and load fixtures (consumes account quota)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: question-pool-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source without remote fixture writes
        run: npm run typecheck && npm test && npm run build

  preview:
    # D1 Free quota is account-wide: isolated PR databases still consume it.
    # Keep source verification automatic; provision/seed only on explicit dispatch.
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_remote_preview }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'rtsgida.workers.dev' }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" >&2 && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2 && exit 1)

      # Jobs do not share files; recreate the already-verified client assets here.
      - name: Build preview assets
        run: npm run build

      - name: Diagnose staging API access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          check_access() {
            local label="$1" endpoint="$2" status codes
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")"
            codes="$(jq -r '[.errors[]?.code | tostring] | join(",")' "$response_file" 2>/dev/null || true)"
            echo "$label: HTTP $status; Cloudflare error codes: ${codes:-none}"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
              echo "::error::$label access check failed; verify token validity, account scope and product permissions."
              return 1
            fi
          }
          api="https://api.cloudflare.com/client/v4"
          failed=0
          check_access "Token verification" "$api/user/tokens/verify" || failed=1
          check_access "D1 database list" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=1" || failed=1
          check_access "R2 bucket list" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets?per_page=1" || failed=1
          exit "$failed"

      - name: Provision isolated PR D1 and R2 resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          safe_cf_request() {
            local response status codes
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "$@")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              codes="$(jq -r '[.errors[]?.code | tostring] | join(",")' "$response" 2>/dev/null || true)"
              echo "::error::Resource request HTTP $status; Cloudflare error codes: ${codes:-none}" >&2
              rm -f "$response"
              return 22
            fi
            cat "$response"
            rm -f "$response"
          }
          key="${PR_NUMBER//[^0-9A-Za-z-]/-}"
          # Use a fresh synthetic database after the unmerged generator schema revision.
          # Keep the earlier preview database intact; this does not change production.
          db_name="yildiz-sinav-qpool-pr-${key}-generation-v2"
          bucket_name="yildiz-sinav-qpool-pr-${key}"
          worker_name="yildiz-sinav-qpool-pr-${key}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          db_response="$(safe_cf_request --header "$auth" "$api/d1/database?name=$(printf '%s' "$db_name" | jq -sRr @uri)")"
          db_id="$(jq -r '.result[0].uuid // empty' <<<"$db_response")"
          if [ -z "$db_id" ]; then
            db_id="$(safe_cf_request --request POST --header "$auth" --header 'Content-Type: application/json' --data "$(jq -nc --arg name "$db_name" '{name:$name}')" "$api/d1/database" | jq -r '.result.uuid // empty')"
          fi
          test -n "$db_id" || (echo "PR D1 database could not be resolved" >&2 && exit 1)

          bucket_response="$(safe_cf_request --header "$auth" "$api/r2/buckets?per_page=1000&name_contains=$(printf '%s' "$bucket_name" | jq -sRr @uri)")"
          bucket_exists="$(jq -r --arg name "$bucket_name" 'if .success != true then error("R2 list failed") else (.result | if type == "object" then .buckets else . end | if type != "array" then error("R2 list shape invalid") else map(select(type == "object" and (.name // "") == $name)) | length end) end' <<<"$bucket_response")"
          if [ "$bucket_exists" = "0" ]; then
            create_response="$(curl --silent --show-error --request POST --header "$auth" --header 'Content-Type: application/json' --data "$(jq -nc --arg name "$bucket_name" '{name:$name,location:"WEUR"}')" --write-out '\n%{http_code}' "$api/r2/buckets" || true)"
            create_status="$(tail -n1 <<<"$create_response")"
            if [[ ! "$create_status" =~ ^2[0-9][0-9]$ && "$create_status" != "409" ]]; then
              echo "$create_response" >&2
              exit 1
            fi
          fi

          jq --arg name "$worker_name" --arg db_name "$db_name" --arg db_id "$db_id" --arg bucket "$bucket_name" \
            'del(.triggers,.queues) | .name=$name | .assets.directory="./dist/client" | .d1_databases=[{binding:"DB",database_name:$db_name,database_id:$db_id,migrations_dir:"migrations"}] | .r2_buckets=[{binding:"FILES",bucket_name:$bucket}] | .vars.ENVIRONMENT="staging"' \
            wrangler.jsonc > wrangler.question-pool-preview.json

          echo "db_name=$db_name" >> "$GITHUB_OUTPUT"
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Apply migration to isolated PR D1
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.question-pool-preview.json

      - name: Deploy isolated PR Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.question-pool-preview.json 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' preview-deploy.log | tail -1 || true)"
          if [ -z "$preview_url" ]; then
            preview_url="https://${{ steps.resources.outputs.worker_name }}.${CLOUDFLARE_WORKERS_SUBDOMAIN}"
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure isolated practice signing key
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npx', ['wrangler', 'secret', 'put', 'SESSION_SECRET', '--config', 'wrangler.question-pool-preview.json'], {
            input: randomBytes(32).toString('hex') + '\n', encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe']
          });
          if (result.error || result.status !== 0) throw new Error('Isolated practice signing key setup failed');
          console.log('Isolated practice signing key configured');
          JS

      - name: Load synthetic staging fixtures
        env:
          CONFIG: wrangler.question-pool-preview.json
        run: |
          npm run seed:generate
          npm run seed:privacy:generate
          for file in \
            tmp/demo-seed.idempotent.sql \
            tmp/demo-college-showcase.idempotent.sql \
            tmp/standard-role-seed.idempotent.sql \
            tmp/demo-exam-catalog.idempotent.sql \
            tmp/demo-camera-fixture.idempotent.sql \
            tmp/demo-standard-fixture.idempotent.sql \
            tmp/privacy-security-fixture.idempotent.sql; do
            npx wrangler d1 execute DB --remote --config "$CONFIG" --file="$file"
          done
          npx wrangler d1 execute DB --remote --config "$CONFIG" --file="scripts/fixtures/question-pool-preview-curriculum.sql"
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command="INSERT OR REPLACE INTO institution_feature_overrides(institution_id,feature_key,enabled) VALUES ('inst_demo','LEARNING_GRAPH',1),('inst_demo','QUESTION_BANK',1),('inst_demo','STUDIO',1),('inst_demo','ASSIGNMENTS',1);"
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command="DELETE FROM assessment_responses WHERE student_id='stu_a001'; DELETE FROM assessment_runs WHERE student_id='stu_a001'; DELETE FROM student_outcome_mastery WHERE student_id='stu_a001'; DELETE FROM coach_followup_actions WHERE student_id='stu_a001'; DELETE FROM coach_mini_tests WHERE student_id='stu_a001';"

      - name: Run question pool and assessment smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SMOKE_DEMO_PASSWORD: Demo123!
        run: node scripts/live-question-assessment-pipeline-smoke.mjs

      - name: Run mandatory tenant-role and KVKK live gate
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SMOKE_DEMO_PASSWORD: Demo123!
        run: npm run test:privacy:live

      - name: Remove transient preview config
        if: always()
        run: rm -f wrangler.question-pool-preview.json preview-deploy.log
