name: Question Pool PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-pool-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resource_inventory:
    name: Approved preview retirement with private backups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect D1 references without exposing credentials or student data
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          base = "https://api.cloudflare.com/client/v4/accounts/" + account
          def get(path):
              request = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  try: codes = [item.get("code") for item in json.load(error).get("errors", [])]
                  except Exception: codes = []
                  raise RuntimeError("API HTTP " + str(error.code) + "; codes=" + str(codes)) from None
              if not data.get("success"):
                  raise RuntimeError("API success=false; codes=" + str([item.get("code") for item in data.get("errors", [])]))
              return data
          def listing(path):
              data = get(path)
              items = data["result"]
              if isinstance(items, dict): items = items.get("environments", items.get("services"))
              if not isinstance(items, list): raise RuntimeError("Unexpected inventory shape")
              info = data.get("result_info") or {}
              if info.get("total_count", len(items)) > len(items) or info.get("total_pages", 1) > 1:
                  raise RuntimeError("Inventory pagination incomplete; cleanup forbidden")
              return items
          databases = listing("/d1/database?per_page=100")
          scripts = listing("/workers/scripts?per_page=1000")
          services = listing("/workers/services")
          report = {"databases": [{"name": d.get("name"), "uuid": d.get("uuid")} for d in databases], "worker_d1_bindings": [], "worker_r2_bindings": [], "worker_service_bindings": [], "worker_domains": [], "errors": []}
          def inspect(label, path):
              try:
                  settings = get(path)["result"]
                  for binding in settings.get("bindings", []):
                      if binding.get("type") == "service":
                          report["worker_service_bindings"].append({"worker": label, "service": binding.get("service")})
                      if binding.get("type") == "r2_bucket":
                          report["worker_r2_bindings"].append({"worker": label, "bucket": binding.get("bucket_name")})
                      if binding.get("type") == "d1":
                          report["worker_d1_bindings"].append({"worker": label, "binding": binding.get("name"), "database_id": binding.get("id")})
              except RuntimeError as error:
                  report["errors"].append({"worker": label, "error": str(error)})
          for script in scripts:
              name = script["id"]
              inspect(name, "/workers/scripts/" + quote(name, safe="") + "/settings")
          for service in services:
              name = service["id"]
              try:
                  environments = listing("/workers/services/" + quote(name, safe="") + "/environments")
              except RuntimeError as error:
                  report["errors"].append({"worker": name, "error": str(error)})
                  continue
              for environment in environments:
                  envname = environment["environment"]
                  inspect(name + ":" + envname, "/workers/services/" + quote(name, safe="") + "/environments/" + quote(envname, safe="") + "/settings")
          report["worker_domains"] = [{"service": row.get("service"), "hostname": row.get("hostname")} for row in listing("/workers/domains")]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "anunex-resource-inventory.json"), "w") as file: json.dump(report, file)
          print(json.dumps(report, indent=2))
          print("READ-ONLY INVENTORY: no deletion, export, deployment or billing change.")
          if report["errors"]: raise SystemExit(1)
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install isolated backup CLI
        run: npm install --prefix "$RUNNER_TEMP/anunex-wrangler" --no-audit --no-fund wrangler@4.148.0
      - name: Back up four preview databases into verified private R2
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          from urllib.parse import quote
          inventory = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "anunex-resource-inventory.json").read_text())
          if inventory["errors"]: raise SystemExit("Incomplete resource inventory; no backups attempted")
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          bucket = "anunex-d1-release-backups"
          def api(path, method="GET", body=None, allow404=False):
              request = urllib.request.Request(base + path, data=json.dumps(body).encode() if body is not None else None, method=method, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response: data = json.load(response)
              except urllib.error.HTTPError as error:
                  if allow404 and error.code == 404: return None
                  raise RuntimeError("Backup API HTTP " + str(error.code)) from None
              if not data.get("success"): raise RuntimeError("Backup API success=false")
              return data["result"]
          if any(row.get("bucket") == bucket for row in inventory.get("worker_r2_bindings", [])):
              raise SystemExit("Backup bucket is bound to an application; backup upload forbidden")
          targets = []
          for pr in [149,156,211,227]:
              name = "yildiz-sinav-qpool-pr-" + str(pr)
              matches = [row for row in inventory["databases"] if row["name"] == name]
              if len(matches) != 1: raise SystemExit("Preview database identity is ambiguous")
              target = matches[0]
              unexpected = [row["worker"] for row in inventory["worker_d1_bindings"] if row["database_id"] == target["uuid"] and row["worker"] not in [name, name + ":production"]]
              if unexpected: raise SystemExit("Preview database has an unexpected consumer; export stopped")
              targets.append(target)
          if api("/r2/buckets/" + bucket, allow404=True) is None:
              api("/r2/buckets", "POST", {"name": bucket, "locationHint": "WEUR"})
          managed = api("/r2/buckets/" + bucket + "/domains/managed")
          custom = api("/r2/buckets/" + bucket + "/domains/custom")
          if managed.get("enabled") is not False or custom.get("domains") != []:
              raise SystemExit("Backup bucket privacy is not confirmed; upload forbidden")
          wrangler = str(pathlib.Path(os.environ["RUNNER_TEMP"], "anunex-wrangler/node_modules/.bin/wrangler"))
          folder = pathlib.Path(os.environ["RUNNER_TEMP"], "anunex-private-backups")
          folder.mkdir(mode=0o700, exist_ok=True)
          def cli(args):
              result = subprocess.run([wrangler] + args, input="y\n", text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=300)
              if result.returncode: raise RuntimeError("Wrangler backup operation failed; no deletion performed")
          prefix = "pr-227/" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          manifest = {"commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"], "bucket": bucket, "backups": []}
          for target in targets:
              name = target["name"]
              sql = folder / (name + ".sql")
              downloaded = folder / (name + ".roundtrip.sql")
              cli(["d1", "export", name, "--remote", "--output", str(sql)])
              if not sql.is_file() or sql.stat().st_size == 0: raise RuntimeError("SQL export is empty")
              digest = hashlib.sha256(sql.read_bytes()).hexdigest()
              key = prefix + "/" + sql.name
              cli(["r2", "object", "put", bucket + "/" + key, "--remote", "--file", str(sql)])
              cli(["r2", "object", "get", bucket + "/" + key, "--remote", "--file", str(downloaded)])
              if hashlib.sha256(downloaded.read_bytes()).hexdigest() != digest: raise RuntimeError("Remote backup hash verification failed")
              manifest["backups"].append({"name": name, "uuid": target["uuid"], "key": key, "bytes": sql.stat().st_size, "sha256": digest})
              print("PRIVATE R2 BACKUP VERIFIED: " + name + "; bytes=" + str(sql.stat().st_size))
              sql.unlink()
              downloaded.unlink()
          path = folder / "manifest.json"
          path.write_text(json.dumps(manifest, indent=2))
          cli(["r2", "object", "put", bucket + "/" + prefix + "/manifest.json", "--remote", "--file", str(path)])
          print(json.dumps(manifest, indent=2))
          print("No databases, Workers or application files deleted.")
          PY

      - name: Retire four explicitly approved test environments after verified backups
        env:
          APPROVED_PREVIEW_RETIREMENT: "149,156,211,227"
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          from urllib.parse import quote
          if os.environ.get("APPROVED_PREVIEW_RETIREMENT") != "149,156,211,227":
              raise SystemExit("Exact retirement approval is missing")
          expected = {
              "yildiz-sinav-qpool-pr-149": "658a1e71-dafb-4f3d-9125-930a524ad949",
              "yildiz-sinav-qpool-pr-156": "3c194d41-07b1-4a74-9509-3000cab695f5",
              "yildiz-sinav-qpool-pr-211": "3819b023-9613-40ca-9ad8-b53f0829e6e8",
              "yildiz-sinav-qpool-pr-227": "2c671dad-7006-4aa9-acde-1a3a5deb0d2c"
          }
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          inventory = json.loads((root / "anunex-resource-inventory.json").read_text())
          manifest = json.loads((root / "anunex-private-backups/manifest.json").read_text())
          if inventory["errors"] or manifest["bucket"] != "anunex-d1-release-backups":
              raise SystemExit("Inventory or private backup guard failed")
          if {row["name"]: row["uuid"] for row in manifest["backups"]} != expected:
              raise SystemExit("Backup manifest does not match the four approved identities")
          for name, uuid in expected.items():
              if not any(row["name"] == name and row["uuid"] == uuid for row in inventory["databases"]):
                  raise SystemExit("Database identity changed; deletion forbidden")
              if any(row["database_id"] == uuid and row["worker"] not in [name, name + ":production"] for row in inventory["worker_d1_bindings"]):
                  raise SystemExit("Database has another consumer; deletion forbidden")
          if any(row["service"] in expected for row in inventory["worker_service_bindings"]):
              raise SystemExit("A Worker service binding references a retirement target")
          if any(row["service"] in expected for row in inventory["worker_domains"]):
              raise SystemExit("An approved test Worker has a custom domain; deletion forbidden")
          wrangler = str(root / "anunex-wrangler/node_modules/.bin/wrangler")
          for row in manifest["backups"]:
              target = root / ("verify-retirement-" + row["name"] + ".sql")
              result = subprocess.run([wrangler, "r2", "object", "get", manifest["bucket"] + "/" + row["key"], "--remote", "--file", str(target)], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=300)
              if result.returncode or not target.is_file():
                  raise SystemExit("Private backup readback failed; deletion forbidden")
              if hashlib.sha256(target.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Private backup hash mismatch; deletion forbidden")
              target.unlink()
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def remove(path):
              request = urllib.request.Request(base + path, method="DELETE", headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("Retirement API HTTP " + str(error.code) + "; remaining targets not removed") from None
              if data.get("success") is not True: raise RuntimeError("Retirement API rejected request")
          for name, uuid in expected.items():
              # No force flag: Cloudflare must reject deletion if another Worker still depends on this script.
              remove("/workers/scripts/" + quote(name, safe=""))
              print("APPROVED TEST WORKER REMOVED: " + name)
              remove("/d1/database/" + uuid)
              print("APPROVED TEST DATABASE REMOVED: " + name + "; uuid=" + uuid)
          print("Approved retirement complete. Private SQL backups and all R2 FILES buckets retained.")
          PY

  preview:
    needs: resource_inventory
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'rtsgida.workers.dev' }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source before preview
        run: npm run typecheck && npm test && npm run build

      - name: Validate staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" >&2 && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2 && exit 1)

      - name: Diagnose staging API access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          check_access() {
            local label="$1" endpoint="$2" status codes
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")"
            codes="$(jq -r '[.errors[]?.code | tostring] | join(",")' "$response_file" 2>/dev/null || true)"
            echo "$label: HTTP $status; Cloudflare error codes: ${codes:-none}"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
              echo "::error::$label access check failed; verify token validity, account scope and product permissions."
              return 1
            fi
          }
          api="https://api.cloudflare.com/client/v4"
          failed=0
          check_access "Token verification" "$api/user/tokens/verify" || failed=1
          check_access "D1 database list" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=1" || failed=1
          check_access "R2 bucket list" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets?per_page=1" || failed=1
          exit "$failed"

      - name: Provision isolated PR D1 and R2 resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          safe_cf_request() {
            local response status codes
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "$@")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              codes="$(jq -r '[.errors[]?.code | tostring] | join(",")' "$response" 2>/dev/null || true)"
              echo "::error::Resource request HTTP $status; Cloudflare error codes: ${codes:-none}" >&2
              rm -f "$response"
              return 22
            fi
            cat "$response"
            rm -f "$response"
          }
          key="${PR_NUMBER//[^0-9A-Za-z-]/-}"
          # Use a fresh synthetic database after the unmerged generator schema revision.
          # Keep the earlier preview database intact; this does not change production.
          db_name="yildiz-sinav-qpool-pr-${key}-generation-v2"
          bucket_name="yildiz-sinav-qpool-pr-${key}"
          worker_name="yildiz-sinav-qpool-pr-${key}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          db_response="$(safe_cf_request --header "$auth" "$api/d1/database?name=$(printf '%s' "$db_name" | jq -sRr @uri)")"
          db_id="$(jq -r '.result[0].uuid // empty' <<<"$db_response")"
          if [ -z "$db_id" ]; then
            db_id="$(safe_cf_request --request POST --header "$auth" --header 'Content-Type: application/json' --data "$(jq -nc --arg name "$db_name" '{name:$name}')" "$api/d1/database" | jq -r '.result.uuid // empty')"
          fi
          test -n "$db_id" || (echo "PR D1 database could not be resolved" >&2 && exit 1)

          bucket_response="$(safe_cf_request --header "$auth" "$api/r2/buckets?per_page=1000&name_contains=$(printf '%s' "$bucket_name" | jq -sRr @uri)")"
          bucket_exists="$(jq -r --arg name "$bucket_name" 'if .success != true then error("R2 list failed") else (.result | if type == "object" then .buckets else . end | if type != "array" then error("R2 list shape invalid") else map(select(type == "object" and (.name // "") == $name)) | length end) end' <<<"$bucket_response")"
          if [ "$bucket_exists" = "0" ]; then
            create_response="$(curl --silent --show-error --request POST --header "$auth" --header 'Content-Type: application/json' --data "$(jq -nc --arg name "$bucket_name" '{name:$name,location:"WEUR"}')" --write-out '\n%{http_code}' "$api/r2/buckets" || true)"
            create_status="$(tail -n1 <<<"$create_response")"
            if [[ ! "$create_status" =~ ^2[0-9][0-9]$ && "$create_status" != "409" ]]; then
              echo "$create_response" >&2
              exit 1
            fi
          fi

          jq --arg name "$worker_name" --arg db_name "$db_name" --arg db_id "$db_id" --arg bucket "$bucket_name" \
            'del(.triggers,.queues) | .name=$name | .assets.directory="./dist/client" | .d1_databases=[{binding:"DB",database_name:$db_name,database_id:$db_id,migrations_dir:"migrations"}] | .r2_buckets=[{binding:"FILES",bucket_name:$bucket}] | .vars.ENVIRONMENT="staging"' \
            wrangler.jsonc > wrangler.question-pool-preview.json

          echo "db_name=$db_name" >> "$GITHUB_OUTPUT"
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$bucket_name" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Apply migration to isolated PR D1
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.question-pool-preview.json

      - name: Deploy isolated PR Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.question-pool-preview.json 2>&1 | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' preview-deploy.log | tail -1 || true)"
          if [ -z "$preview_url" ]; then
            preview_url="https://${{ steps.resources.outputs.worker_name }}.${CLOUDFLARE_WORKERS_SUBDOMAIN}"
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure isolated practice signing key
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npx', ['wrangler', 'secret', 'put', 'SESSION_SECRET', '--config', 'wrangler.question-pool-preview.json'], {
            input: randomBytes(32).toString('hex') + '\n', encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe']
          });
          if (result.error || result.status !== 0) throw new Error('Isolated practice signing key setup failed');
          console.log('Isolated practice signing key configured');
          JS

      - name: Load synthetic staging fixtures
        env:
          CONFIG: wrangler.question-pool-preview.json
        run: |
          npm run seed:generate
          npm run seed:privacy:generate
          for file in \
            tmp/demo-seed.idempotent.sql \
            tmp/demo-college-showcase.idempotent.sql \
            tmp/standard-role-seed.idempotent.sql \
            tmp/demo-exam-catalog.idempotent.sql \
            tmp/demo-camera-fixture.idempotent.sql \
            tmp/demo-standard-fixture.idempotent.sql \
            tmp/privacy-security-fixture.idempotent.sql; do
            npx wrangler d1 execute DB --remote --config "$CONFIG" --file="$file"
          done
          npx wrangler d1 execute DB --remote --config "$CONFIG" --file="scripts/fixtures/question-pool-preview-curriculum.sql"
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command="INSERT OR REPLACE INTO institution_feature_overrides(institution_id,feature_key,enabled) VALUES ('inst_demo','LEARNING_GRAPH',1),('inst_demo','QUESTION_BANK',1),('inst_demo','STUDIO',1),('inst_demo','ASSIGNMENTS',1);"
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command="DELETE FROM assessment_responses WHERE student_id='stu_a001'; DELETE FROM assessment_runs WHERE student_id='stu_a001'; DELETE FROM student_outcome_mastery WHERE student_id='stu_a001'; DELETE FROM coach_followup_actions WHERE student_id='stu_a001'; DELETE FROM coach_mini_tests WHERE student_id='stu_a001';"

      - name: Run question pool and assessment smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SMOKE_DEMO_PASSWORD: Demo123!
        run: node scripts/live-question-assessment-pipeline-smoke.mjs

      - name: Run mandatory tenant-role and KVKK live gate
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          SMOKE_DEMO_PASSWORD: Demo123!
        run: npm run test:privacy:live

      - name: Remove transient preview config
        if: always()
        run: rm -f wrangler.question-pool-preview.json preview-deploy.log
