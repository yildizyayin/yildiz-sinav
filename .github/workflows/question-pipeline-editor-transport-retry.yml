name: One timeout-only editor transport retry
on:
  push:
    branches: [staging]
    paths: [.github/question-pipeline-editor-transport-retry.execute]
permissions:
  contents: read
concurrency:
  group: question-pipeline-editor-transport-retry
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Deploy private shared editorial pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-question-production-worker.mjs
      - name: Correct the same candidate once and verify separately with no new writer or pilot slot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-question-pipeline-editor-transport-retry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-pipeline-editor-transport-retry-${{ github.run_id }}
          path: tmp/question-pipeline-editor-transport-retry/
