name: Question team production verification
on:
  workflow_run:
    workflows: [Deploy Production Cloudflare Worker]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[app-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-question-team-production.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: question-team-production-${{ github.run_id }}
          path: tmp/question-team-production/
