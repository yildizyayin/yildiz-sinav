name: Collect official curricula (read-only)

# Owner (4 Nov): fetches missing MEB TYMM programmes from tymm.meb.gov.tr for review. No secrets, no database access.
on:
  workflow_dispatch:
  push:
    branches:
      - curriculum-collect
    paths:
      - 'scripts/collect-official-curricula.mjs'
      - '.github/workflows/collect-official-curricula.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/collect-official-curricula.mjs
      # The result is committed back to this collection branch only (never main) so it can be reviewed in a PR.
      - name: Commit the collected file to the collection branch
        if: github.ref == 'refs/heads/curriculum-collect'
        run: |
          mkdir -p data/maarif
          mv official-curricula-collected.json data/maarif/official-curricula-collected.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/maarif/official-curricula-collected.json
          git commit -m "Toplanan resmî TYMM programları (salt okunur)" || exit 0
          git push origin HEAD:curriculum-collect
