name: "Ücretsiz Ajan - CI Sağlık"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Typecheck, test ve build
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund; npm run typecheck; npm test; npm run build; } 2>&1 | tee agent-ci-report.md
      - name: Raporu yayınla
        if: always()
        uses: ./.github/actions/agent-report
        with:
          report-file: agent-ci-report.md
          title: "CI Sağlık Ajanı Raporu"
          label: "ci-saglik-ajani"
          status: ${{ steps.verify.outcome }}
          close-on-success: "true"
          label-color: "0e8a16"
      - name: Başarısızsa workflow'u işaretle
        if: steps.verify.outcome == 'failure'
        run: exit 1
