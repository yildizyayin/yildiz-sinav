#anunex-astra-admin .ax-nav-button[aria-current="page"]{background:color-mix(in srgb,var(--ax-nav-accent,var(--ax-green)) 11%,var(--ax-paper));box-shadow:inset 3px 0 0 var(--ax-nav-accent,var(--ax-green));color:var(--ax-ink)}
#anunex-astra-admin .ax-nav-button[aria-current="page"]:after{background:var(--ax-nav-accent,var(--ax-green))}
</style>
<script>
(()=>{
const root=document.getElementById('anunex-astra-admin');
const main=root.querySelector('#ax-main');
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules=[
['home','Yönetim Merkezi','#6d8395','Genel bakış','layout-dashboard'],
['exam','Sınav Merkezi','#ba7953','Sınavlar, değerlendirme ve yayın','clipboard-list'],
['optical','Optik Tanımlama','#929084','Formlar, FMT ve okuma parametreleri','scan-line'],
['print','Optik Basma','#51808a','Baskı şablonları ve kalibrasyon','printer'],
['institutions','Kurum ve Erişim','#6d9780','Kurumlar, zincirler ve yetkiler','building-2'],
['attendance','Yoklama ve Ödev','#8b9f69','Yetkili takip ve ödev kapsamı','list-checks'],
['studio','İçerik ve Studio','#ba9655','Soru havuzu ve içerik onayı','layers'],
['sheets','Föy Merkezi','#82a7bd','Föyler ve yıllık yayın planı','files'],
['books','Kitap Merkezi','#477382','Kişiye özel kitap ve sıfır hata kitapçığı','book-open'],
['games','Mini Test ve Oyunlar','#658ea9','Öğrenme çıktıları, testler ve oyunlar','gamepad-2'],
['video','Video Merkezi','#bb7b68','YouTube ve video çözümleri','play'],
['guidance','Hedef ve Rehberlik','#5f967a','Hedefler, rehber onayı ve RBA','compass'],
['reports','Karne ve Raporlar','#5d8989','Rol ve kapsama göre raporlar','chart-no-axes-combined'],
['communication','İletişim Merkezi','#678f9d','Duyuru, WhatsApp ve teslimat','messages-square'],
['nibiru','Nibiru','#d5ac59','Rol bazlı eğitim ve çalışma desteği','sun'],
['results','Sonuç Ağı','#61758d','Kurum, bayi ve sonuç erişimi','network'],
['platform','Platform Yönetimi','#7d8582','Lisans, özellikler ve platform işleri','settings-2']
];
let institutions=[
{id:1,name:'Atlas Eğitim Kurumları',code:'ÖRNEK-001',type:'Özel okul',city:'İstanbul',district:'Kadıköy',contact:'Kurum iletişim birimi',manager:'Kurum yöneticisi',chain:'Atlas Eğitim Grubu',license:'Yıllık',status:'active',students:840},
{id:2,name:'Pusula Akademi',code:'ÖRNEK-002',type:'Kurs merkezi',city:'Ankara',district:'Çankaya',contact:'Kurum iletişim birimi',manager:'Kurum yöneticisi',chain:'Bağımsız',license:'Yıllık',status:'active',students:325},
{id:3,name:'Ufuk Koleji',code:'ÖRNEK-003',type:'Özel okul',city:'İzmir',district:'Bornova',contact:'Kurum iletişim birimi',manager:'Kurum yöneticisi',chain:'Bağımsız',license:'Demo',status:'active',students:610},
{id:4,name:'Meridyen Eğitim',code:'ÖRNEK-004',type:'Kurs merkezi',city:'Bursa',district:'Nilüfer',contact:'Kurum iletişim birimi',manager:'Kurum yöneticisi',chain:'Meridyen Grubu',license:'Yıllık',status:'active',students:280},
{id:5,name:'Kuzey Ortaokulu',code:'ÖRNEK-005',type:'Ortaokul',city:'Eskişehir',district:'Tepebaşı',contact:'Kurum iletişim birimi',manager:'Kurum yöneticisi',chain:'Bağımsız',license:'Askıda',status:'passive',students:420}
];
let route='home',selectedId=1,detailTab='Genel',query='',status='all',returnRoute='home';
function refreshIcons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
function navButton(id){const m=modules.find(x=>x[0]===id);const active=route===id||(id==='institutions'&&['institution-detail','new-institution','edit-institution'].includes(route));return `<button type="button" class="ax-nav-button cursor-interaction" style="--ax-nav-accent:${m[2]}" data-route="${id}" ${active?'aria-current="page"':''}><span class="ax-disc" style="--planet:${m[2]}" aria-hidden="true"></span><span>${m[1]}</span></button>`;}
function nav(){root.querySelector('#ax-navigation').innerHTML=navButton('home')+[['Operasyon',['exam','optical','print','institutions','attendance']],['İçerik ve gelişim',['studio','sheets','books','games','video','guidance','reports']],['İletişim ve yönetim',['communication','results','platform']]].map(([name,ids])=>`<details class="ax-nav-group" open><summary class="cursor-interaction">${name}</summary>${ids.map(navButton).join('')}</details>`).join('');}
function button(label,action,cls='',ico='arrow-right'){return `<button type="button" class="ax-button ${cls} cursor-interaction" data-action="${action}">${ico?icon(ico):''}${label}</button>`;}
function textButton(label,action){return `<button type="button" class="ax-text-button cursor-interaction" data-action="${action}">${label}${icon('arrow-up-right')}</button>`;}
function pageHead(eyebrow,title,sub,extra=''){return `<div class="ax-page-head"><div><div class="ax-eyebrow">${eyebrow}</div><h1>${title}</h1><p class="ax-subtitle">${sub}</p></div>${extra}</div>`;}
function setFeedback(message){const el=root.querySelector('#ax-feedback');el.hidden=!message;el.textContent=message;}
function go(id){route=id;setFeedback('');root.querySelector('#ax-search-results').hidden=true;root.querySelector('#ax-global-input').value='';root.querySelector('#ax-sidebar').classList.remove('ax-open');root.querySelector('#ax-menu-button').setAttribute('aria-expanded','false');root.querySelector('#ax-menu-button').setAttribute('aria-label','Menüyü aç');nav();render();}
function dashboard(){return pageHead('Yönetim Merkezi','Genel bakış','İşlerin, kurumların ve yayınların tek bir yörüngede.',`<div class="ax-date">${icon('calendar-days')}9 Ekim 2026, Cuma</div>`)+`
<div class="ax-kpis">
<button class="ax-kpi cursor-interaction" data-route="institutions"><span class="ax-kpi-label">${icon('building-2')}Aktif kurum</span><span class="ax-kpi-value">128</span><span class="ax-kpi-note"><b>+6</b> bu dönem</span></button>
<button class="ax-kpi cursor-interaction" data-action="students"><span class="ax-kpi-label">${icon('users')}Kayıtlı öğrenci</span><span class="ax-kpi-value">24.860</span><span class="ax-kpi-note">2026–2027 dönemi</span></button>
<button class="ax-kpi cursor-interaction" data-route="exam"><span class="ax-kpi-label">${icon('clipboard-list')}Sınav işlemi</span><span class="ax-kpi-value">12</span><span class="ax-kpi-note">3 sınavda bekliyor</span></button>
<button class="ax-kpi cursor-interaction" data-route="studio"><span class="ax-kpi-label">${icon('layers')}İçerik onayı</span><span class="ax-kpi-value">36</span><span class="ax-kpi-note">İncelemeye hazır</span></button>
</div>
<section class="ax-focus" aria-labelledby="ax-focus-title"><div><div class="ax-focus-label">${icon('crosshair')}Bugünün odağı <span> / </span> Sınav Merkezi</div><h2 id="ax-focus-title">Yayından önce son kontroller.</h2><p>LGS Türkiye Geneli 03 için öğrenci eşleşmelerini ve kitapçık seçimlerini tamamlayın.</p><div class="ax-focus-actions">${button('Kontrolleri aç','exam-check','ax-copper','arrow-right')}${textButton('Yayın planı','release-plan')}</div></div><div class="ax-orbit-scene" aria-hidden="true"><span class="ax-mars"></span><span class="ax-moon"></span><span class="ax-orbit-caption">MARS / 03</span></div></section>
<div class="ax-grid-two"><section><div class="ax-section-heading"><h2>İlginizi bekleyenler <span class="ax-count">4 iş grubu</span></h2>${textButton('Tümü','all-tasks')}</div><div class="ax-panel">
${taskRow('Öğrenci eşleştirmeleri','LGS Türkiye Geneli 03 · Atlas Eğitim','user-round-search','7','match')}
${taskRow('A / B kitapçık kontrolü','LGS Türkiye Geneli 03 · Pusula Akademi','copy-check','3','booklet')}
${taskRow('Kurum aktivasyonu','Yeni dönem için erişim talebi','building-2','2','activations','ax-sage')}
${taskRow('Soru inceleme ve onay','8. sınıf · Matematik ve Türkçe','file-check-2','36','content-review','ax-blue')}
</div></section><section><div class="ax-section-heading"><h2>Yaklaşan yayınlar</h2>${textButton('Takvim','release-plan')}</div><div class="ax-timeline"><div class="ax-timeline-item"><div class="ax-calendar-day">12<small>Ekim</small></div><div><h3>LGS Türkiye Geneli 03</h3><p>Pazartesi · 10.00</p><span class="ax-status ax-warm">Son kontrol bekliyor</span></div></div><div class="ax-timeline-item"><div class="ax-calendar-day">14<small>Ekim</small></div><div><h3>Haftalık gelişim föyü</h3><p>8. sınıf · Sayısal / Sözel</p><span class="ax-status">Yayın planında</span></div></div></div></section></div>
<section class="ax-quick"><div class="ax-section-heading"><h2>Hızlı işlemler</h2><span class="ax-count">Kaldığınız yerden devam edin</span></div><div class="ax-quick-grid">${[['Sınav oluştur','new-exam','plus'],['Optik yükle','upload','upload'],['Optik bas','print-optical','printer'],['Kurum ekle','new-institution','building-2']].map(([label,action,ico])=>`<button type="button" class="ax-quick-button cursor-interaction" data-action="${action}">${icon(ico)}${label}</button>`).join('')}</div></section>
<section class="ax-recent"><div class="ax-section-heading"><h2>Son işlemler</h2><span class="ax-count">Bu çalışma alanında</span></div><div class="ax-activity-row">${icon('check')}<span><strong>8. sınıf Matematik</strong> soru grubu incelemeye alındı.</span><time>10.42</time></div><div class="ax-activity-row">${icon('file-up')}<span><strong>Pusula Akademi</strong> optik verisi ön kontrole eklendi.</span><time>10.18</time></div><div class="ax-activity-row">${icon('building-2')}<span><strong>Atlas Eğitim</strong> yeni dönem kurum bilgilerini güncelledi.</span><time>09.56</time></div></section>`;}
function taskRow(title,subtitle,ico,count,action,color=''){return `<button type="button" class="ax-task-row cursor-interaction" data-action="${action}"><span class="ax-task-icon ${color}">${icon(ico)}</span><span class="ax-task-text"><strong>${title}</strong><small>${subtitle}</small></span><span class="ax-number-pill">${count}</span>${icon('chevron-right').replace('data-lucide','class="ax-row-arrow" data-lucide')}</button>`;}
function institutionRows(){const rows=institutions.filter(x=>(status==='all'||x.status===status)&&(x.name+' '+x.city+' '+x.district+' '+x.code).toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr')));return rows.length?rows.map(x=>`<div class="ax-institution-row"><button class="ax-institution-name cursor-interaction" data-institution="${x.id}"><span class="ax-institution-mark">${esc(x.name.split(' ').slice(0,2).map(s=>s[0]).join(''))}</span><span><strong>${esc(x.name)}</strong><small>${esc(x.type)} · ${esc(x.license)} lisans</small></span></button><span class="ax-dir-location">${esc(x.city)}<small>${esc(x.district)}</small></span><span class="ax-dir-students">${x.students}</span><span class="ax-status ${x.status==='active'?'':'ax-neutral'}">${x.status==='active'?'Aktif':'Pasif'}</span><button class="ax-icon-button cursor-interaction" data-institution="${x.id}" aria-label="${esc(x.name)} detayını aç">${icon('chevron-right')}</button></div>`).join(''):`<div class="ax-empty">Bu filtreye uygun kurum bulunamadı.</div>`;}
function directory(){return `<div class="ax-page-head ax-directory-title"><div><div class="ax-feature-head"><span class="ax-disc" style="--planet:#6d9780" aria-hidden="true"></span>Dünya / Kurum ve Erişim</div><h1>Kurumlar</h1><p class="ax-subtitle">Kurumların, ekiplerin ve erişimlerin ortak adresi.</p></div>${button('Kurum ekle','new-institution','ax-green','plus')}</div><div class="ax-inline-meta"><span><strong>${institutions.length}</strong> örnek kurum</span><span><strong>${institutions.filter(x=>x.status==='active').length}</strong> aktif</span><span><strong>2</strong> zincir grubu</span></div><div class="ax-toolbar"><label class="ax-field-search">${icon('search')}<input id="ax-institution-search" aria-label="Kurum adı veya şehir ara" placeholder="Kurum adı veya şehir ara" value="${esc(query)}"></label><select id="ax-status-filter" class="ax-select" aria-label="Kurum durumu"><option value="all" ${status==='all'?'selected':''}>Tüm durumlar</option><option value="active" ${status==='active'?'selected':''}>Aktif</option><option value="passive" ${status==='passive'?'selected':''}>Pasif</option></select>${button('İçe aktar','import-institutions','','upload')}</div><section class="ax-directory" aria-label="Örnek kurum rehberi"><div class="ax-directory-head"><span>Kurum</span><span class="ax-dir-location">Konum</span><span class="ax-dir-students">Öğrenci</span><span>Durum</span><span></span></div><div id="ax-institution-rows">${institutionRows()}</div><div class="ax-dir-footer"><span>Örnek kurum rehberi · yerel çalışma</span><span>2026–2027</span></div></section><div class="ax-support-note">${icon('shield-check')}<span>Kurum detayından kullanıcı kapsamını, lisansı, dönemi ve zincir bağlantısını yönetin.</span></div>`;}
function detail(){const x=institutions.find(i=>i.id===selectedId);const tabs=['Genel','Kullanıcılar','Lisans','Dönem','Zincir'];return `<button class="ax-text-button ax-back cursor-interaction" data-action="back-directory">${icon('arrow-left')}Kurumlara dön</button><div class="ax-page-head ax-directory-title"><div class="ax-detail-title"><span class="ax-institution-mark">${esc(x.name.split(' ').slice(0,2).map(s=>s[0]).join(''))}</span><div><h1>${esc(x.name)}</h1><p class="ax-subtitle">${esc(x.city)} / ${esc(x.district)} · ${esc(x.type)}</p></div></div><span class="ax-status ${x.status==='active'?'':'ax-neutral'}">${x.status==='active'?'Aktif kurum':'Pasif kurum'}</span></div><div class="ax-tabs" aria-label="Kurum bölümleri">${tabs.map(t=>`<button type="button" class="ax-tab cursor-interaction" data-detail-tab="${t}" aria-pressed="${t===detailTab}">${t}</button>`).join('')}</div>${detailContent(x)}`;}
function detailContent(x){if(detailTab==='Genel')return `<div class="ax-detail-grid"><section><div class="ax-section-heading"><h2>Kurum bilgileri</h2>${textButton('Düzenle','edit-institution')}</div><dl class="ax-key-values"><dt>Kurum adı</dt><dd>${esc(x.name)}</dd><dt>MEB / kurum kodu</dt><dd>${esc(x.code)||'Belirtilmedi'}</dd><dt>Yetkili</dt><dd>${esc(x.manager)||'Belirtilmedi'}</dd><dt>İletişim</dt><dd>${esc(x.contact)||'Belirtilmedi'}</dd><dt>Zincir</dt><dd>${esc(x.chain)||'Bağımsız'}</dd><dt>Geçerli dönem</dt><dd>2026–2027</dd></dl></section><aside class="ax-inset"><h3>Erişim durumu</h3><p>${x.status==='active'?'Kurum bu örnekte aktif. Durumu değiştirdiğinizde yalnızca bu önizleme güncellenir.':'Kurum bu örnekte pasif. Yeniden etkinleştirme, yalnızca bu önizlemeye uygulanır.'}</p>${button(x.status==='active'?'Kurumu pasife al':'Kurumu etkinleştir','toggle-institution','',x.status==='active'?'pause':'check')}<p>Kalıcı silme bu çalışma alanının hızlı işlemleri arasında yer almaz.</p></aside></div>`;
const configs={'Kullanıcılar':['Kullanıcı ve yetki kapsamı','Kurum yöneticileri, personel ve öğrenci/veli bağlantıları kurum kapsamına göre yönetilir.','Bu örnekte kişisel kullanıcı kayıtları gösterilmez.',['Personel ve rehber öğretmen yetkileri','Atanmış sınıf ve öğrenci kapsamı','Öğrenci / veli hesabı bağlantıları'],'Erişim planını incele','access-plan'],'Lisans':['Lisans durumu',`${esc(x.license)} lisans · ${esc(x.name)}`,'Lisans işlemleri için kurum ve dönem birlikte değerlendirilir.',['Demo / yıllık lisans geçişi','Mevcut verileri koruma veya yeni başlangıç','Lisansı askıya alma ve etkinleştirme'],'Lisans işlemleri','license-plan'],'Dönem':['Geçerli eğitim dönemi','2026–2027','Dönem geçişi ayrı bir ön kontrol ve kapsam onayı gerektirir.',['Sınıflar ve öğrenci kayıtları','Arşivlenecek sınav ve rapor kapsamı','Yeni döneme taşınacak kurum ayarları'],'Dönem geçişini incele','year-plan'],'Zincir':['Zincir bağlantısı',esc(x.chain)||'Bağımsız kurum','Zincir yetkisi yalnız atanmış kurumları kapsar.',['Zincir yöneticisinin kurum kapsamı','Kurumlar arası karşılaştırma yetkisi','Kurumun zincire eklenmesi / ayrılması'],'Bağlantıyı düzenle','edit-institution']}[detailTab];return `<section class="ax-inset"><div class="ax-section-heading"><h2>${configs[0]}</h2><span class="ax-status ax-neutral">Önizleme</span></div><p>${configs[1]}</p><p>${configs[2]}</p><ul class="ax-intent-list">${configs[3].map(t=>`<li>${icon('check')}${t}</li>`).join('')}</ul>${button(configs[4],configs[5],'ax-green','arrow-right')}</section>`;}
function form(edit){const x=edit?institutions.find(i=>i.id===selectedId):{name:'',code:'',type:'Özel okul',city:'',district:'',contact:'',manager:'',chain:'',license:'Demo',status:'active'};const field=(label,name,required=false,wide=false)=>`<label class="ax-field ${wide?'ax-wide':''}">${label}${required?' *':''}<input name="${name}" value="${esc(x[name])}" ${required?'required':''} maxlength="100" autocomplete="off"></label>`;return `<button class="ax-text-button ax-back cursor-interaction" data-action="${edit?'back-detail':'back-directory'}">${icon('arrow-left')}${edit?'Kurum detayına':'Kurumlara'} dön</button>${pageHead('Kurum ve Erişim',edit?'Kurum bilgilerini düzenle':'Yeni kurum','Bu form örnek kayıtlarla çalışır; bilgiler yalnızca bu oturumda tutulur.')}<form class="ax-form" id="ax-institution-form" data-edit="${edit}"><div class="ax-form-header"><h2>${edit?'Kurum bilgileri':'Kurum kartı'}</h2><button type="button" class="ax-icon-button cursor-interaction" data-action="${edit?'back-detail':'back-directory'}" aria-label="Formu kapat">${icon('x')}</button></div><div class="ax-form-grid">${field('Kurum adı','name',true,true)}${field('MEB kodu (isteğe bağlı)','code')}<label class="ax-field">Kurum türü<select name="type">${['Özel okul','Ortaokul','Lise','Kurs merkezi'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></label>${field('İl','city',true)}${field('İlçe','district',true)}${field('İletişim birimi / kanal etiketi','contact')}${field('Yetkili unvanı','manager')}${field('Zincir adı (isteğe bağlı)','chain')}<label class="ax-field">Lisans durumu<select name="license">${['Demo','Yıllık','Askıda'].map(v=>`<option ${x.license===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="ax-field">Kurum durumu<select name="status"><option value="active" ${x.status==='active'?'selected':''}>Aktif</option><option value="passive" ${x.status==='passive'?'selected':''}>Pasif</option></select></label></div><p class="ax-form-note">* Zorunlu alan. Önizlemede gerçek kişi, telefon veya e-posta bilgisi kullanmayın.</p><p class="ax-error" id="ax-form-error" role="alert" hidden></p><div class="ax-form-actions">${button('Vazgeç',edit?'back-detail':'back-directory','','')}<button type="submit" class="ax-button ax-green cursor-interaction">${icon('check')}${edit?'Değişiklikleri kaydet':'Örnek kurumu oluştur'}</button></div></form>`;}

function intent(action){returnRoute=route;const matched=Object.values(moduleFeatures).flat().find(x=>x[3]===action);const cfg=intents[action]||[matched?matched[0]:{'access-plan':'Kurum erişim planı','license-plan':'Lisans işlemleri','year-plan':'Dönem geçişi','target-plan':'Okul ve program hedefleri'}[action]||'İş akışı önizlemesi',matched?matched[1]:'Yetkili kapsamda işlem planı',['İlgili kurum, dönem ve rol kapsamı belirlenir.','Bilgiler ve işlem etkisi kullanıcı tarafından gözden geçirilir.','Bu adım tasarım kapsamını gösterir; gerçek işlem başlatılmaz.']];root.querySelector('#ax-current-title').textContent=cfg[0];main.innerHTML=`<button type="button" class="ax-text-button ax-back cursor-interaction" data-action="return">${icon('arrow-left')}Çalışma alanına dön</button>${pageHead('İş akışı önizlemesi',esc(cfg[0]),esc(cfg[1]))}<section class="ax-intent-panel"><span class="ax-status ax-neutral">Tasarım kapsamı</span><h2 style="margin-top:18px">İşlem adımları</h2><ul class="ax-intent-list" style="margin-top:14px">${cfg[2].map(t=>`<li>${icon('arrow-right')}<span>${esc(t)}</span></li>`).join('')}</ul>${button('Geri dön','return','','arrow-left')}${action==='exam-check'?`<div class="ax-module-grid">${moduleCard('Öğrenci eşleştirmeleri','7 örnek kayıt','user-round-search','match')}${moduleCard('Kitapçık kontrolü','3 örnek kayıt','copy-check','booklet')}</div>`:''}</section>`;refreshIcons();}
function render(){root.querySelector('#ax-current-title').textContent=route==='home'?'Genel bakış':modules.find(m=>m[0]===route)?.[1]||'Kurum ve Erişim';main.innerHTML=route==='home'?dashboard():route==='institutions'?directory():route==='institution-detail'?detail():route==='new-institution'?form(false):route==='edit-institution'?form(true):route==='guidance'?guidance():modulePage();refreshIcons();}
root.addEventListener('click',e=>{
const target=e.target.closest('button');if(!target||!root.contains(target))return;
if(target.id==='ax-menu-button'){const open=root.querySelector('#ax-sidebar').classList.toggle('ax-open');target.setAttribute('aria-expanded',String(open));target.setAttribute('aria-label',open?'Menüyü kapat':'Menüyü aç');return;}
if(target.dataset.route){go(target.dataset.route);return;}
if(target.dataset.institution){selectedId=Number(target.dataset.institution);detailTab='Genel';go('institution-detail');return;}
if(target.dataset.detailTab){detailTab=target.dataset.detailTab;render();return;}
const action=target.dataset.action;if(!action)return;setFeedback('');
if(action==='new-institution'||action==='edit-institution'){go(action);return;}
if(action==='back-directory'){go('institutions');return;}
if(action==='back-detail'){go('institution-detail');return;}
if(action==='back-home'){go('home');return;}
if(action==='return'){go(returnRoute);return;}
if(action==='toggle-institution'){const x=institutions.find(i=>i.id===selectedId);x.status=x.status==='active'?'passive':'active';render();setFeedback(`${x.name} bu önizlemede ${x.status==='active'?'etkinleştirildi':'pasife alındı'}. Gerçek kurum kaydı değişmedi.`);return;}
intent(action);
});

root.addEventListener('change',e=>{if(e.target.id==='ax-status-filter'){status=e.target.value;root.querySelector('#ax-institution-rows').innerHTML=institutionRows();refreshIcons();}});
root.addEventListener('submit',e=>{if(e.target.id!=='ax-institution-form')return;e.preventDefault();const f=e.target;const value=name=>f.elements.namedItem(name).value.trim();if(!value('name')||!value('city')||!value('district')){const error=root.querySelector('#ax-form-error');error.hidden=false;error.textContent='Kurum adı, il ve ilçe alanlarını doldurun.';return;}const data={};['name','code','type','city','district','contact','manager','chain','license','status'].forEach(k=>data[k]=value(k));if(f.dataset.edit==='true'){institutions=institutions.map(x=>x.id===selectedId?{...x,...data}:x);}else{selectedId=Math.max(...institutions.map(x=>x.id))+1;institutions.push({...data,id:selectedId,students:0});}detailTab='Genel';go('institution-detail');setFeedback('Kurum bilgileri yalnızca bu önizleme oturumunda kaydedildi. Gerçek kayıt oluşturulmadı veya değiştirilmedi.');});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.querySelector('#ax-search-results').hidden=true;if(route==='new-institution')go('institutions');if(route==='edit-institution')go('institution-detail');}});
nav();render();
})();
</script>
